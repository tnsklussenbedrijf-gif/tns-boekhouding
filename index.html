<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TNS Boekhouding</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--blue:#1d4ed8;--blue-d:#1e40af;--blue-l:#dbeafe;--bg:#f3f6fb;--card:#fff;--txt:#111827;--muted:#6b7280;--line:#e5e7eb;--green:#059669;--red:#dc2626;--amber:#d97706;--r:12px}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:var(--txt);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue-l);border-color:var(--blue)}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field{margin-bottom:12px}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.btn{background:var(--blue);color:#fff;border:0;padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--blue-d)}
.btn.sec{background:#fff;color:var(--blue);border:1px solid #bfdbfe}.btn.sec:hover{background:var(--blue-l)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}.btn.ghost:hover{background:#f9fafb}
.btn.danger{background:#fff;color:var(--red);border:1px solid #fecaca}.btn.danger:hover{background:#fef2f2}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
#app{display:flex;min-height:100vh}
aside{width:230px;background:#0f172a;color:#cbd5e1;padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;flex-shrink:0}
.logo{color:#fff;font-weight:800;font-size:18px;letter-spacing:.3px;padding:6px 10px 16px}
.logo small{display:block;color:#64748b;font-weight:500;font-size:11px;margin-top:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#cbd5e1;text-decoration:none;font-weight:500;margin-bottom:2px}
.nav a:hover{background:#1e293b;color:#fff}.nav a.active{background:var(--blue);color:#fff}
.nav a .ic{width:18px;text-align:center;opacity:.9}
.nav .badge{margin-left:auto;background:#f59e0b;color:#111;font-size:11px;padding:1px 7px;border-radius:10px;font-weight:700}
.compsel{margin:8px 0 14px}
.compsel select{background:#1e293b;color:#fff;border-color:#334155}
main{flex:1;padding:22px 28px;max-width:1300px;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px;flex-wrap:wrap}
h1{font-size:22px;margin:0}h2{font-size:16px;margin:0 0 12px}h3{font-size:14px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.grid{display:grid;gap:14px}.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}.kpi .v{font-size:24px;font-weight:800;margin-top:4px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.pos{color:var(--green)}.neg{color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#f8fafc}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}
.tag.g{background:#d1fae5;color:#065f46}.tag.r{background:#fee2e2;color:#991b1b}.tag.a{background:#fef3c7;color:#92400e}.tag.b{background:var(--blue-l);color:var(--blue-d)}.tag.gr{background:#f1f5f9;color:#475569}
.tablewrap{overflow-x:auto}
.empty{text-align:center;color:var(--muted);padding:30px}
.drop{border:2px dashed #93c5fd;border-radius:var(--r);padding:34px;text-align:center;background:#eff6ff;color:var(--blue-d);cursor:pointer;transition:.15s}
.drop:hover,.drop.over{background:var(--blue-l);border-color:var(--blue)}
.drop b{display:block;font-size:16px;margin-bottom:4px}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto;z-index:50}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:1100px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.narrow{max-width:560px}
.modal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.preview{background:#f1f5f9;border-radius:10px;min-height:300px;max-height:75vh;overflow:auto;display:flex;align-items:flex-start;justify-content:center}
.preview img{max-width:100%;height:auto}.preview iframe{width:100%;height:75vh;border:0}
.vatrow{display:grid;grid-template-columns:90px 1fr 1fr 32px;gap:8px;align-items:end;margin-bottom:6px}
.totals{background:#f8fafc;border-radius:10px;padding:12px;margin-top:8px}
.totals div{display:flex;justify-content:space-between;padding:3px 0}
.totals .big{font-weight:800;font-size:16px;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.warn{background:#fef3c7;color:#92400e;border:1px solid #fde68a;padding:8px 12px;border-radius:8px;font-size:13px;margin:8px 0}
.ok{background:#d1fae5;color:#065f46;border:1px solid #a7f3d0;padding:8px 12px;border-radius:8px;font-size:13px;margin:8px 0}
.err{background:#fee2e2;color:#991b1b;border:1px solid #fecaca;padding:8px 12px;border-radius:8px;font-size:13px;margin:8px 0}
.aibox{display:flex;align-items:center;gap:12px;padding:12px 14px;background:linear-gradient(90deg,#eef2ff,#eff6ff);border:1px solid #c7d2fe;border-radius:10px;margin-bottom:12px}
.spin{width:18px;height:18px;border:3px solid #c7d2fe;border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;flex-shrink:0}
@keyframes sp{to{transform:rotate(360deg)}}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}.filters>*{width:auto;min-width:120px}
.toast{position:fixed;bottom:20px;right:20px;background:#0f172a;color:#fff;padding:12px 18px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:99;display:none;max-width:400px}
.toast.show{display:block}
.btwtable td:first-child{font-weight:600}.btwtable .rub{color:var(--muted);font-weight:700;width:50px}
.sub{color:var(--muted);font-size:12px}
.chk{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--txt);font-size:13px}.chk input{width:auto}
.link{color:var(--blue);cursor:pointer;text-decoration:underline;background:none;border:0;padding:0;font-size:inherit}
.thumb{width:36px;height:36px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:pointer;background:#f1f5f9;display:inline-flex;align-items:center;justify-content:center;font-size:16px}
.steps{display:flex;gap:6px;margin-bottom:12px;font-size:12px}
.steps span{padding:4px 10px;border-radius:999px;background:#f1f5f9;color:var(--muted)}.steps span.on{background:var(--blue);color:#fff}
.matchbox{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px;background:#f8fafc;font-size:12px}
.hamb{display:none}
@media(max-width:760px){aside{position:fixed;left:-240px;z-index:40;transition:.2s}aside.open{left:0}main{padding:14px}.hamb{display:inline-block}}
@media print{aside,.topbar .actions,.noprint{display:none!important}main{padding:0}body{background:#fff}.card{border:0}}
.lock{position:fixed;inset:0;background:#0f172a;display:flex;align-items:center;justify-content:center;z-index:100}
.lock .box{background:#fff;padding:30px;border-radius:16px;width:340px;text-align:center}
</style>
</head>

</div>

<!-- Modal: factuur bewerken / AI resultaat -->
<div class="modal-bg" id="invModal"><div class="modal">

<!-- Modal: generiek -->
<div class="modal-bg" id="genModal"><div class="modal narrow" id="genModalBox"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="hiddenUpload" multiple accept="image/*,application/pdf" style="display:none" onchange="handleFiles(this.files);this.value=''">
<input type="file" id="hiddenBank" accept=".csv,.txt,.sta,.940,.mt940,text/*" style="display:none" onchange="handleBankFile(this.files[0]);this.value=''">
<input type="file" id="hiddenRestore" accept=".json" style="display:none" onchange="restoreBackup(this.files[0]);this.value=''">
<script>
/* ================== SUPABASE CONFIG ================== */
const SUPABASE_URL='https://beujkjbaaurklckmwwzi.supabase.co';
const SUPABASE_KEY='sb_publishable_1eNsuiQbC1QAm_f23ltmJQ_36cYVvJA';
if(!window.supabase){document.body.innerHTML='<div style="padding:40px;font-family:sans-serif"><h2>Kan supabase-js niet laden</h2>Controleer je internetverbinding en herlaad de pagina.</div>';throw new Error('supabase-js niet geladen')}
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const CATS=['Materiaal','Onderaannemer','Gereedschap','Auto & brandstof','Huur & huisvesting','Telefoon & internet','Software & abonnementen','Marketing','Verzekering','Kantoor','Representatie','Bankkosten','Overig'];
let S={companies:[],active:'tns',purchases:[],sales:[],bank:[],settings:{model:'claude-sonnet-4-6',autoRead:true},role:'accountant',user:null};
const isOwner=()=>S.role==='owner';
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

/* ---- Laden uit Supabase ---- */
const snap={inv:{},bank:{},comp:{},settings:''};
function invRow(i){return{id:i.id,company:i.company,type:i.type,date:i.date||null,status:i.status||'open',needs_check:!!i.needsCheck,file_id:i.fileId||null,data:i,updated_at:new Date().toISOString()}}
function bankRow(b){return{id:b.id,company:b.company,date:b.date||null,amount:b.amount,match_id:b.matchId||null,data:b,updated_at:new Date().toISOString()}}
function takeSnapshot(){snap.inv={};snap.bank={};snap.comp={};[...S.purchases,...S.sales].forEach(i=>snap.inv[i.id]=JSON.stringify(i));S.bank.forEach(b=>snap.bank[b.id]=JSON.stringify(b));S.companies.forEach(c=>snap.comp[c.id]=JSON.stringify(c));snap.settings=JSON.stringify(S.settings)}
async function load(){
 const [c,i,b,st,pr]=await Promise.all([
  sb.from('bh_companies').select('*').order('sort'),
  sb.from('bh_invoices').select('data'),
  sb.from('bh_bank').select('data'),
  sb.from('bh_settings').select('*').eq('key','app').maybeSingle(),
  sb.from('bh_profiles').select('role').eq('user_id',S.user.id).maybeSingle()
 ]);
 if(c.error)throw new Error('Bedrijven laden: '+c.error.message);
 S.companies=c.data.map(x=>({id:x.id,name:x.name,short:x.short||x.name,kvk:x.kvk||'',btwnr:x.btwnr||'',iban:x.iban||'',sort:x.sort||0}));
 const inv=(i.data||[]).map(x=>x.data);
 S.purchases=inv.filter(x=>x.type==='purchase');S.sales=inv.filter(x=>x.type==='sale');
 [S.purchases,S.sales].forEach(l=>l.sort((a,b)=>(b.date||'').localeCompare(a.date||'')));
 S.bank=(b.data||[]).map(x=>x.data);S.bank.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
 S.settings=Object.assign({model:'claude-sonnet-4-6',autoRead:true},st.data?.value||{});
 S.role=pr.data?.role||'accountant';
 try{const a=localStorage.getItem('tnsbh_active');if(a&&S.companies.find(x=>x.id===a))S.active=a}catch(e){}
 if(!S.companies.find(x=>x.id===S.active))S.active=S.companies[0]?.id||'tns';
 takeSnapshot();
}
/* ---- Opslaan: vergelijk met snapshot, schrijf alleen wijzigingen ---- */
let saveT=null,saving=false,saveAgain=false;
function save(){try{localStorage.setItem('tnsbh_active',S.active)}catch(e){}if(!isOwner())return;clearTimeout(saveT);saveT=setTimeout(syncNow,250)}
async function syncNow(){
 if(saving){saveAgain=true;return}saving=true;setSyncState('busy');
 try{
  const invs=[...S.purchases,...S.sales];const upI=[],delI=[];const seen={};
  invs.forEach(i=>{seen[i.id]=1;const j=JSON.stringify(i);if(snap.inv[i.id]!==j)upI.push(invRow(i))});
  Object.keys(snap.inv).forEach(id=>{if(!seen[id])delI.push(id)});
  const upB=[],delB=[];const seenB={};
  S.bank.forEach(b=>{seenB[b.id]=1;const j=JSON.stringify(b);if(snap.bank[b.id]!==j)upB.push(bankRow(b))});
  Object.keys(snap.bank).forEach(id=>{if(!seenB[id])delB.push(id)});
  const upC=[],delC=[];const seenC={};
  S.companies.forEach(c=>{seenC[c.id]=1;if(snap.comp[c.id]!==JSON.stringify(c))upC.push({id:c.id,name:c.name,short:c.short,kvk:c.kvk,btwnr:c.btwnr,iban:c.iban,sort:c.sort||0})});
  Object.keys(snap.comp).forEach(id=>{if(!seenC[id])delC.push(id)});
  const ops=[];
  if(upC.length)ops.push(sb.from('bh_companies').upsert(upC));
  for(let k=0;k<upI.length;k+=200)ops.push(sb.from('bh_invoices').upsert(upI.slice(k,k+200)));
  for(let k=0;k<upB.length;k+=200)ops.push(sb.from('bh_bank').upsert(upB.slice(k,k+200)));
  if(delI.length)ops.push(sb.from('bh_invoices').delete().in('id',delI));
  if(delB.length)ops.push(sb.from('bh_bank').delete().in('id',delB));
  if(delC.length)ops.push(sb.from('bh_companies').delete().in('id',delC));
  if(snap.settings!==JSON.stringify(S.settings))ops.push(sb.from('bh_settings').upsert({key:'app',value:S.settings,updated_at:new Date().toISOString()}));
  const res=await Promise.all(ops);const err=res.find(r=>r&&r.error);
  if(err)throw new Error(err.error.message);
  takeSnapshot();setSyncState('ok');
 }catch(e){console.error(e);setSyncState('err');toast('⚠️ Opslaan in cloud mislukt: '+esc(e.message),6000)}
 saving=false;if(saveAgain){saveAgain=false;syncNow()}
}
function setSyncState(s){const el=document.getElementById('syncState');if(!el)return;el.textContent=s==='busy'?'⟳ opslaan…':s==='ok'?'✓ opgeslagen':'⚠ niet opgeslagen';el.style.color=s==='err'?'#f87171':'#64748b'}
/* ---- Bijlagen in Supabase Storage ---- */
const fileCache={};
async function putFile(id,obj){const {error}=await sb.storage.from('bijlagen').upload(id,obj.blob,{contentType:obj.type||'application/octet-stream',upsert:true});if(error)throw new Error('Upload mislukt: '+error.message);fileCache[id]={blob:obj.blob,type:obj.type,name:obj.name}}
async function getFile(id){if(!id)return null;if(fileCache[id])return fileCache[id];const {data,error}=await sb.storage.from('bijlagen').download(id);if(error||!data)return null;const f={blob:data,type:data.type||'application/octet-stream',name:id};fileCache[id]=f;return f}
async function delFile(id){if(!id)return;delete fileCache[id];try{await sb.storage.from('bijlagen').remove([id])}catch(e){}}
async function allFiles(){const out={};const ids=[...S.purchases,...S.sales].filter(p=>p.fileId).map(p=>p.fileId);for(const id of ids){const f=await getFile(id);if(f)out[id]=f}return out}

/* ================== HELPERS ================== */
const fmt=n=>(Number(n)||0).toLocaleString('nl-NL',{style:'currency',currency:'EUR'});
const r2=n=>Math.round((Number(n)||0)*100)/100;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fdate=d=>{if(!d)return'';const [y,m,dd]=d.split('-');return `${dd}-${m}-${y}`};
const today=()=>new Date().toISOString().slice(0,10);
const comp=()=>S.companies.find(c=>c.id===S.active)||S.companies[0];
const myP=()=>S.purchases.filter(p=>p.company===S.active);
const myS=()=>S.sales.filter(p=>p.company===S.active);
const myB=()=>S.bank.filter(p=>p.company===S.active);
function toast(m,ms=3200){const t=document.getElementById('toast');t.innerHTML=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),ms)}
function closeModal(id){document.getElementById(id).classList.remove('open')}
function openModal(id){document.getElementById(id).classList.add('open')}
function genModal(html){const b=document.getElementById('genModalBox');b.classList.add('narrow');b.innerHTML=html;openModal('genModal')}
function quarterOf(d){return Math.floor((parseInt(d.slice(5,7))-1)/3)+1}
function inPeriod(d,year,q){if(!d)return false;if(d.slice(0,4)!==String(year))return false;if(q==='all')return true;if(String(q).startsWith('m'))return parseInt(d.slice(5,7))===parseInt(q.slice(1));return quarterOf(d)===Number(q)}
function parseNum(v){if(v==null||v==='')return 0;if(typeof v==='number')return v;let s=String(v).trim().replace(/[€\s]/g,'');if(/,\d{1,2}$/.test(s))s=s.replace(/\./g,'').replace(',','.');else if(/\.\d{1,2}$/.test(s))s=s.replace(/,/g,'');else s=s.replace(/[.,]/g,'');const n=parseFloat(s);return isNaN(n)?0:n}
function normDate(v){if(!v)return'';v=String(v).trim();let m;if((m=v.match(/^(\d{4})-(\d{2})-(\d{2})/)))return `${m[1]}-${m[2]}-${m[3]}`;if((m=v.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/)))return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;if((m=v.match(/^(\d{4})(\d{2})(\d{2})$/)))return `${m[1]}-${m[2]}-${m[3]}`;if((m=v.match(/^(\d{2})(\d{2})(\d{2})$/)))return `20${m[1]}-${m[2]}-${m[3]}`;return''}
function download(name,content,type='text/plain'){const b=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function csv(rows){return '﻿'+rows.map(r=>r.map(v=>{v=v==null?'':String(v);return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(';')).join('\r\n')}
function vatTotals(lines){let net=0,vat=0;(lines||[]).forEach(l=>{net+=Number(l.net)||0;vat+=Number(l.vat)||0});return{net:r2(net),vat:r2(vat),gross:r2(net+vat)}}

<script>
/* ================== BESTANDEN & AI LEZEN ================== */
async function compressImage(file){
 if(!file.type.startsWith('image/'))return file;
 try{const bmp=await createImageBitmap(file);const max=2000;let w=bmp.width,h=bmp.height;const sc=Math.min(1,max/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(bmp,0,0,w,h);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.86));return blob||file}catch(e){return file}
}
function blobToB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)})}
function newInvoice(type){return{id:uid(),company:S.active,type,party:'',partyBtw:'',nr:'',date:today(),due:'',lines:[{rate:21,net:0,vat:0}],cat:type==='purchase'?'Materiaal':'Omzet',desc:'',status:'open',paidDate:'',vatDeductible:true,needsCheck:false,fileId:null,fileType:'',fileName:'',created:new Date().toISOString(),ai:null,reverse:false}}
function findDup(inv){const g=r2(vatTotals(inv.lines).gross);const party=(inv.party||'').trim().toLowerCase();const nr=(inv.nr||'').trim().toLowerCase();return listOf(inv.type).find(x=>x.id!==inv.id&&x.company===inv.company&&(( nr&&(x.nr||'').trim().toLowerCase()===nr&&(x.party||'').trim().toLowerCase()===party)||(g&&Math.abs(vatTotals(x.lines).gross-g)<0.01&&x.date===inv.date&&(x.party||'').trim().toLowerCase()===party)))||null}
function listOf(type){return type==='purchase'?S.purchases:S.sales}
function findInv(id){return S.purchases.find(p=>p.id===id)||S.sales.find(p=>p.id===id)}

async function handleFiles(files,type='purchase'){
 if(!isOwner()){toast('Alleen-lezen account: uploaden niet mogelijk');return}
 files=[...files].filter(f=>f.type.startsWith('image/')||f.type==='application/pdf');
 if(!files.length){toast('Alleen foto\'s (JPG/PNG) of PDF');return}
 const list=listOf(type);const created=[];let done=0;
 const prog=(msg)=>toast(msg,120000);
 prog(`⬆ Uploaden 0/${files.length}…`);
 // uploaden, 3 tegelijk
 await runPool(files,3,async f=>{
  const blob=await compressImage(f);const fid=uid();
  try{await putFile(fid,{blob,type:blob.type||f.type,name:f.name})}catch(e){toast('❌ '+esc(f.name)+': '+esc(e.message),6000);return}
  const inv=newInvoice(type);inv.fileId=fid;inv.fileType=blob.type||f.type;inv.fileName=f.name;inv.needsCheck=true;inv.party=f.name.replace(/\.[^.]+$/,'');
  list.unshift(inv);created.push(inv);done++;prog(`⬆ Uploaden ${done}/${files.length}…`);
 });
 save();if(!created.length)return;
 if(S.settings.autoRead){
  let read=0;prog(`🤖 AI leest 0/${created.length}…`);
  await runPool(created,3,async inv=>{try{await aiRead(inv)}catch(e){inv.ai={error:e.message};inv.aiHint='AI-lezen mislukt: '+e.message}read++;prog(`🤖 AI leest ${read}/${created.length}…`);if(read%5===0)save()});
  save();
 }
 const perQ={};created.forEach(i=>{const k=i.date?`Q${quarterOf(i.date)} ${i.date.slice(0,4)}`:'?';perQ[k]=(perQ[k]||0)+1});
 const dups=created.filter(i=>findDup(i)).length;
 toast(`✅ ${created.length} verwerkt · ${Object.entries(perQ).map(([k,v])=>k+': '+v).join(', ')}${dups?` · <b style="color:#fca5a5">🚫 ${dups} mogelijk dubbel</b>`:''} — controleer ze nu één voor één`,9000);
 const page=type==='purchase'?'inkoop':'verkoop';
 if(cur!==page)location.hash='#'+page;else render();
 reviewQueue=created.map(i=>i.id);
 openInvoice(type,created[created.length-1].id,false);
}
async function runPool(items,n,fn){let i=0;const w=[];for(let k=0;k<Math.min(n,items.length);k++)w.push((async()=>{while(i<items.length){const it=items[i++];await fn(it)}})());await Promise.all(w)}
let reviewQueue=[];
function nextToCheck(type){const ids=reviewQueue.filter(id=>{const x=findInv(id);return x&&x.needsCheck});if(ids.length)return findInv(ids[0]);return listOf(type).find(x=>x.company===S.active&&x.needsCheck)||null}

const AI_PROMPT=`Je bent een Nederlandse boekhoudassistent. Lees deze factuur/bon en geef ALLEEN geldige JSON terug (geen uitleg, geen markdown):
{"document_type":"inkoopfactuur|verkoopfactuur|bon|creditnota|anders",
"supplier":"naam leverancier/afzender",
"supplier_btw":"btw-nummer afzender of leeg",
"customer":"naam ontvanger/klant of leeg",
"invoice_number":"factuur- of bonnummer",
"invoice_date":"YYYY-MM-DD",
"due_date":"YYYY-MM-DD of leeg",
"currency":"EUR",
"vat_lines":[{"rate":21,"net":0.00,"vat":0.00}],
"total_excl":0.00,"total_vat":0.00,"total_incl":0.00,
"vat_reverse_charged":false,
"category":"een van: ${CATS.join(', ')}",
"description":"korte omschrijving van wat gekocht is (max 10 woorden)",
"confidence":0.0,
"notes":"opmerkingen, bv onleesbaar of twijfel"}
Regels: bedragen als getallen met punt als decimaal. Splits per btw-tarief (21, 9, 0). Bij 'btw verlegd' zet vat_reverse_charged true en rate 0. Bij een creditnota: bedragen negatief. Als een bedrag niet leesbaar is: bereken het uit de andere bedragen. total_incl moet gelijk zijn aan total_excl + total_vat.`;

async function aiRead(inv){
 if(!inv.fileId)throw new Error('Geen bijlage');
 const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Niet ingelogd');
 const res=await fetch(SUPABASE_URL+'/functions/v1/lees-factuur',{method:'POST',headers:{'content-type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+session.access_token},body:JSON.stringify({fileId:inv.fileId,model:S.settings.model||'claude-sonnet-4-6'})});
 let j;try{j=await res.json()}catch(e){throw new Error('Serverfout '+res.status)}
 if(!res.ok||j.error)throw new Error(j.error||('Serverfout '+res.status));
 applyAi(inv,j.result);return j.result;
}
function applyAi(inv,d){
 inv.ai={confidence:d.confidence,notes:d.notes,docType:d.document_type,readAt:new Date().toISOString()};
 const isSale=d.document_type==='verkoopfactuur';
 inv.party=(isSale?d.customer:d.supplier)||d.supplier||inv.party;
 inv.partyBtw=d.supplier_btw||'';inv.nr=d.invoice_number||'';inv.date=normDate(d.invoice_date)||inv.date;inv.due=normDate(d.due_date)||'';
 inv.reverse=!!d.vat_reverse_charged;
 let lines=(d.vat_lines||[]).map(l=>({rate:[21,9,0].includes(Number(l.rate))?Number(l.rate):21,net:r2(parseNum(l.net)),vat:r2(parseNum(l.vat))})).filter(l=>l.net||l.vat);
 const ti=r2(parseNum(d.total_incl)),te=r2(parseNum(d.total_excl)),tv=r2(parseNum(d.total_vat));
 if(!lines.length){ if(te||tv)lines=[{rate:te&&tv?Math.round(tv/te*100):21,net:te,vat:tv}]; else if(ti){lines=[{rate:21,net:r2(ti/1.21),vat:r2(ti-ti/1.21)}]} else lines=[{rate:21,net:0,vat:0}]; }
 lines.forEach(l=>{if(![21,9,0].includes(l.rate))l.rate=21});
 const t=vatTotals(lines);inv.aiWarn='';
 if(ti&&Math.abs(t.gross-ti)>0.05)inv.aiWarn=`Som van btw-regels (${fmt(t.gross)}) wijkt af van totaal op factuur (${fmt(ti)}). Controleer de bedragen.`;
 inv.lines=lines;
 if(CATS.includes(d.category))inv.cat=d.category;
 inv.desc=d.description||inv.desc;inv.needsCheck=true;
 if(d.document_type==='verkoopfactuur')inv.aiHint='AI denkt dat dit een VERKOOPfactuur is (uitgaand). Klopt dat? Wijzig dan het type.';
 if((d.confidence||1)<0.6)inv.aiHint=(inv.aiHint||'')+' Lage zekerheid — controleer alle velden.';
 const dup=findDup(inv);inv.dupOf=dup?dup.id:null;
}

}

 pv.innerHTML=f.type==='application/pdf'?`<iframe src="${curBlobUrl}"></iframe>`:`<img src="${curBlobUrl}" alt="bijlage">`;

async function replaceAttachment(file){if(!file)return;const blob=await compressImage(file);const fid=uid();await putFile(fid,{blob,type:blob.type||file.type,name:file.name});if(curInv.fileId)await delFile(curInv.fileId);curInv.fileId=fid;curInv.fileType=blob.type||file.type;curInv.fileName=file.name;await showPreview();if(S.settings.autoRead)aiReadCurrent()}

 const st=document.getElementById('aiStatus');
  if(!curInv.fileId){st.innerHTML='<div class="warn">Voeg eerst een bijlage toe.</div>';return}
 readForm();st.innerHTML='<div class="aibox"><div class="spin"></div><div><b>AI leest de factuur…</b><div class="sub">Leverancier, datum, btw-tarieven en bedragen worden herkend</div></div></div>';
 document.getElementById('reReadBtn').disabled=true;
 try{const d=await aiRead(curInv);renderInvForm();st.innerHTML=`<div class="ok">✅ Gelezen (zekerheid ${Math.round((d.confidence||0)*100)}%). <b>Controleer de velden en klik Opslaan.</b>${d.notes?'<div class="sub">'+esc(d.notes)+'</div>':''}</div>`}
 catch(e){st.innerHTML='<div class="err">❌ AI-lezen mislukt: '+esc(e.message)+'<br><span class="sub">Vul de gegevens handmatig in of probeer opnieuw.</span></div>'}
 document.getElementById('reReadBtn').disabled=false;
}

 <div class="row"><div class="field"><label>Type</label><select id="f_type" onchange="changeType(this.value)"><option value="purchase" ${isP?'selected':''}>Inkoop (kosten)</option><option value="sale" ${!isP?'selected':''}>Verkoop (omzet)</option></select></div>
 <div class="field"><label>Status</label><select id="f_status"><option value="open" ${i.status!=='betaald'?'selected':''}>Open</option><option value="betaald" ${i.status==='betaald'?'selected':''}>Betaald</option></select></div></div>

 <div class="field"><label>BTW-nr ${isP?'leverancier':'klant'}</label><input id="f_partyBtw" value="${esc(i.partyBtw)}"></div></div>

 <div class="row"><div class="field"><label>${isP?'Kostensoort':'Categorie'}</label><select id="f_cat">${(isP?CATS:['Omzet','Omzet diensten','Omzet materiaal','Overig']).map(c=>`<option ${c===i.cat?'selected':''}>${c}</option>`).join('')}</select></div><div class="field" style="flex:2"><label>Omschrijving</label><input id="f_desc" value="${esc(i.desc)}"></div></div>
 <label>BTW-regels (bedragen excl. btw per tarief)</label>

 <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 10px"><button class="btn ghost sm" onclick="addLine()">+ tarief toevoegen</button>

<script>
/* ================== BANK IMPORT ================== */
function parseCSVText(text){const delim=(text.match(/;/g)||[]).length>=(text.match(/,/g)||[]).length?';':(text.match(/\t/g)||[]).length>(text.match(/,/g)||[]).length?'\t':',';const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}else{if(c==='"')q=true;else if(c===delim){row.push(cell);cell=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()!==''))rows.push(row);row=[];cell=''}else cell+=c}}row.push(cell);if(row.some(x=>x.trim()!==''))rows.push(row);return rows}
function abnField(s,key){s=s||'';let m=s.match(new RegExp('/'+key+'/([^/]*)','i'));if(m)return m[1].trim();m=s.match(new RegExp(key+':\\s*(.*?)(?:\\s{2,}|$)','i'));return m?m[1].trim():''}
function findCol(h,names){for(const n of names){const i=h.findIndex(x=>x.toLowerCase().replace(/[^a-z0-9]/g,'').includes(n));if(i>=0)return i}return -1}
function parseBankCSV(text){
 const rows=parseCSVText(text);if(rows.length<1)return[];
 const h=rows[0].map(x=>x.trim());
 /* ABN AMRO TAB export zonder header: rek, munt, datum(yyyymmdd), saldo, saldo, rentedatum, bedrag, omschrijving */
 if(rows[0].length>=8&&/^\d{8}$/.test(h[2])&&/^\d{9,10}$/.test(h[0].replace(/\D/g,'')))return rows.map(r=>({date:normDate(r[2]),amount:parseNum(r[6]),name:abnField(r[7],'Naam')||abnField(r[7],'NAME'),desc:abnField(r[7],'Omschrijving')||abnField(r[7],'REMI')||(r[7]||'').trim(),ref:abnField(r[7],'IBAN')})).filter(t=>t.date);
 const iDate=findCol(h,['datum','date','boekdatum','transactiedatum']),iAmt=findCol(h,['bedrageur','bedrag','amount','transactiebedrag']),iAfBij=findCol(h,['afbij','debitcredit','creditdebit','dc']),iName=findCol(h,['naamomschrijving','naamtegenpartij','naam','name','tegenpartij','counterparty']),iDesc=findCol(h,['mededelingen','omschrijving','description','remittance','memo']),iRef=findCol(h,['tegenrekening','tegenrekeningiban','counterpartyiban','iban']);
 if(iDate<0||iAmt<0)throw new Error('Kolommen niet herkend. Verwacht minimaal een Datum- en Bedrag-kolom (ING, Rabobank, ABN AMRO, Knab, Bunq CSV).');
 return rows.slice(1).map(r=>{let amt=parseNum(r[iAmt]);if(iAfBij>=0){const ab=(r[iAfBij]||'').trim().toLowerCase();if(ab==='af'||ab==='debit'||ab==='d')amt=-Math.abs(amt);else if(ab==='bij'||ab==='credit'||ab==='c')amt=Math.abs(amt)}return{date:normDate(r[iDate]),amount:amt,name:iName>=0?(r[iName]||'').trim():'',desc:iDesc>=0?(r[iDesc]||'').trim():'',ref:iRef>=0?(r[iRef]||'').trim():''}}).filter(t=>t.date&&t.amount);
}
function parseMT940(text){
 const out=[];const lines=text.split(/\r?\n/);let cur=null;
 for(const ln of lines){
  if(ln.startsWith(':61:')){if(cur)out.push(cur);const m=ln.slice(4).match(/^(\d{6})(\d{4})?([CD])R?([A-Z])?(\d+,\d{0,2})/);cur={date:m?normDate(m[1]):'',amount:m?parseNum(m[5])*(m[3]==='D'?-1:1):0,name:'',desc:'',ref:''};}
  else if(ln.startsWith(':86:')&&cur){cur.desc=ln.slice(4).trim()}
  else if(cur&&!ln.startsWith(':')&&!ln.startsWith('-')&&cur.desc!==undefined&&ln.trim())cur.desc+=' '+ln.trim();
 }
 if(cur)out.push(cur);
 out.forEach(t=>{const n=t.desc.match(/\/NAME\/([^\/]+)/)||t.desc.match(/NAAM:\s*([^\s].*?)(?:\s{2,}|OMSCHR|IBAN|$)/i);t.name=n?n[1].trim():'';const r=t.desc.match(/\/REMI\/([^\/]+)/)||t.desc.match(/OMSCHR\w*:\s*(.*?)(?:\s{2,}|$)/i);if(r)t.desc=r[1].trim();const ib=t.desc.match(/[A-Z]{2}\d{2}[A-Z]{4}\d{10}/);if(ib)t.ref=ib[0]});
 return out.filter(t=>t.date&&t.amount);
}
async function handleBankFile(file){
 if(!file)return;const text=await file.text();
 let txs;try{txs=/^:20:|^:61:/m.test(text)?parseMT940(text):parseBankCSV(text)}catch(e){toast('❌ '+e.message,6000);return}
 if(!txs.length){toast('Geen mutaties gevonden in bestand');return}
 const existing=new Set(myB().map(b=>b.date+'|'+b.amount+'|'+b.desc.slice(0,40)));
 let n=0;txs.forEach(t=>{const k=t.date+'|'+t.amount+'|'+t.desc.slice(0,40);if(existing.has(k))return;existing.add(k);S.bank.push({id:uid(),company:S.active,...t,matchId:null,ignored:false});n++});
 S.bank.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
 const auto=autoMatch();save();
 const miss=myB().filter(b=>!b.matchId&&!b.ignored);const mp=miss.filter(b=>b.amount<0).length,ms=miss.filter(b=>b.amount>0).length;
 toast(`✅ ${n} nieuwe mutaties · ${auto} automatisch gekoppeld · <b>ontbreekt: ${mp} inkoopbon, ${ms} verkoopfactuur</b>`,9000);
 if(cur!=='bank')location.hash='#bank';else render();
}
function candidates(b){const list=b.amount<0?myP():myS();const a=Math.abs(b.amount);return list.filter(i=>i.status!=='betaald'&&Math.abs(vatTotals(i.lines).gross-a)<0.011).map(i=>{let sc=0;const bd=new Date(b.date),id=new Date(i.date);const dd=Math.abs((bd-id)/864e5);if(dd<=45)sc+=2;else if(dd<=120)sc+=1;const hay=(b.name+' '+b.desc).toLowerCase();const pw=i.party.toLowerCase().split(/\s+/).filter(w=>w.length>3);if(pw.some(w=>hay.includes(w)))sc+=3;if(i.nr&&hay.includes(i.nr.toLowerCase()))sc+=4;return{i,sc}}).sort((x,y)=>y.sc-x.sc)}
function autoMatch(){let n=0;myB().forEach(b=>{if(b.matchId||b.ignored)return;const c=candidates(b);if(c.length===1&&c[0].sc>=3||c.length>1&&c[0].sc>=5&&c[0].sc>c[1].sc){linkBank(b,c[0].i);n++}});return n}
function linkBank(b,inv){b.matchId=inv.id;inv.status='betaald';inv.paidDate=b.date;inv.bankRef=b.id}
function matchBank(bid,iid){const b=S.bank.find(x=>x.id===bid),i=findInv(iid);if(!b||!i)return;linkBank(b,i);save();render();toast('Gekoppeld: '+esc(i.party))}
function unmatchBank(bid){const b=S.bank.find(x=>x.id===bid);const i=findInv(b.matchId);if(i){i.status='open';i.paidDate='';i.bankRef=null}b.matchId=null;save();render()}
function ignoreBank(bid,v){const b=S.bank.find(x=>x.id===bid);b.ignored=v;save();render()}
function bankCreate(bid){const b=S.bank.find(x=>x.id===bid);const type=b.amount<0?'purchase':'sale';const inv=newInvoice(type);inv.party=b.name||b.desc.slice(0,40);inv.date=b.date;inv.desc=b.desc.slice(0,80);const g=Math.abs(b.amount);const net=r2(g/1.21);inv.lines=[{rate:21,net,vat:r2(g-net)}];inv.status='betaald';inv.paidDate=b.date;inv.bankRef=b.id;listOf(type).unshift(inv);b.matchId=inv.id;save();openInvoice(type,inv.id)}
function deleteBankAll(){if(!confirm('Alle bankmutaties van dit bedrijf verwijderen? (Facturen blijven staan)'))return;S.bank=S.bank.filter(b=>b.company!==S.active);save();render()}
let bankFlt='open';
function renderBank(){document.getElementById('pageActions').innerHTML=`<button class="btn" onclick="document.getElementById('hiddenBank').click()">⬆ Bankbestand importeren</button> <button class="btn sec" onclick="const n=autoMatch();save();render();toast(n+' automatisch gekoppeld')">⚡ Auto-koppelen</button>`;
 let list=myB();const open=list.filter(b=>!b.matchId&&!b.ignored).length;
 if(bankFlt==='open')list=list.filter(b=>!b.matchId&&!b.ignored);else if(bankFlt==='matched')list=list.filter(b=>b.matchId);else if(bankFlt==='ignored')list=list.filter(b=>b.ignored);
 const all=myB();const matched=all.filter(b=>b.matchId).length,ign=all.filter(b=>b.ignored).length;const missP=all.filter(b=>!b.matchId&&!b.ignored&&b.amount<0),missS=all.filter(b=>!b.matchId&&!b.ignored&&b.amount>0);
 const unpaidP=myP().filter(i=>i.status!=='betaald'&&!i.needsCheck),unpaidS=myS().filter(i=>i.status!=='betaald'&&!i.needsCheck);
 document.getElementById('page').innerHTML=`${all.length?`<div class="grid g3" style="margin-bottom:14px">
  <div class="kpi"><div class="l">Gekoppeld aan factuur/bon</div><div class="v pos">${matched}</div><div class="s">van ${all.length} mutaties${ign?` · ${ign} genegeerd`:''}</div></div>

function btwCalc(year,q){
 const P=myP().filter(p=>inPeriod(p.date,year,q)),Sa=myS().filter(p=>inPeriod(p.date,year,q));
 const r={r1a:{net:0,vat:0},r1b:{net:0,vat:0},r1e:{net:0,vat:0},r3b:{net:0},r4b:{net:0,vat:0},r5b:0,inNet:0,inVat:0,inGross:0,outGross:0,nonDed:0};
 Sa.forEach(s=>{s.lines.forEach(l=>{if(s.reverse){r.r3b.net+=l.net}else if(l.rate==21){r.r1a.net+=l.net;r.r1a.vat+=l.vat}else if(l.rate==9){r.r1b.net+=l.net;r.r1b.vat+=l.vat}else{r.r1e.net+=l.net}});r.outGross+=vatTotals(s.lines).gross});
 P.forEach(p=>{const t=vatTotals(p.lines);r.inNet+=t.net;r.inVat+=t.vat;r.inGross+=t.gross;if(p.reverse){const v=r2(t.net*0.21);r.r4b.net+=t.net;r.r4b.vat+=v;if(p.vatDeductible!==false)r.r5b+=v}else if(p.vatDeductible!==false)r.r5b+=t.vat;else r.nonDed+=t.vat});
 r.r5a=r2(r.r1a.vat+r.r1b.vat+r.r4b.vat);r.r5b=r2(r.r5b);r.r5c=r2(r.r5a-r.r5b);r.cntP=P.length;r.cntS=Sa.length;r.check=P.filter(p=>p.needsCheck).length+Sa.filter(p=>p.needsCheck).length;
 Object.keys(r).forEach(k=>{if(typeof r[k]==='object'){r[k].net=r2(r[k].net);if('vat'in r[k])r[k].vat=r2(r[k].vat)}});return r;
}

 <div class="sub" style="margin-top:6px">Gebruikers toevoegen: Supabase → Authentication → Users → Add user. Nieuwe gebruikers zijn standaard alleen-lezen; eigenaar maken kan met SQL: <code>update bh_profiles set role='owner' where email='…';</code></div>
 <div style="margin-top:10px"><button class="btn ghost" onclick="logout()">Uitloggen</button></div></div></div>
 ${isOwner()?`<div class="card"><h2>Gevaarlijke zone</h2><button class="btn danger" onclick="wipeAll()">Alle data van alle bedrijven wissen</button></div>`:``}`}
function saveCompany(){const c=comp();c.name=v('c_name');c.short=v('c_short');c.kvk=v('c_kvk');c.btwnr=v('c_btw');c.iban=v('c_iban');save();fillCompanies();toast('Bedrijfsgegevens opgeslagen');function v(id){return document.getElementById(id).value.trim()}}
function addCompany(){const n=prompt('Naam van het nieuwe bedrijf:');if(!n)return;const c={id:uid(),name:n,short:n,kvk:'',btwnr:'',iban:'',sort:S.companies.length+1};S.companies.push(c);S.active=c.id;save();fillCompanies();render()}
function removeCompany(){const c=comp();if(!confirm(`"${c.name}" en ALLE bijbehorende facturen en bankmutaties verwijderen?`))return;S.purchases.filter(p=>p.company===c.id).concat(S.sales.filter(p=>p.company===c.id)).forEach(p=>delFile(p.fileId));S.purchases=S.purchases.filter(p=>p.company!==c.id);S.sales=S.sales.filter(p=>p.company!==c.id);S.bank=S.bank.filter(p=>p.company!==c.id);S.companies=S.companies.filter(x=>x.id!==c.id);S.active=S.companies[0].id;save();fillCompanies();render()}
function saveSettings(){S.settings.model=document.getElementById('s_model').value.trim()||'claude-sonnet-4-6';S.settings.autoRead=document.getElementById('s_auto').checked;save();toast('Instellingen opgeslagen')}
async function testApi(){const el=document.getElementById('apiTest');el.innerHTML='<div class="aibox"><div class="spin"></div>Testen…</div>';try{const {data:{session}}=await sb.auth.getSession();const res=await fetch(SUPABASE_URL+'/functions/v1/lees-factuur',{method:'POST',headers:{'content-type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+session.access_token},body:JSON.stringify({fileId:'__test__'})});const j=await res.json();if(res.status===404&&/Bijlage niet gevonden/.test(j.error||''))el.innerHTML='<div class="ok">✅ Edge Function bereikbaar, ingelogd en API key aanwezig. Upload een bon om echt te testen.</div>';else if(res.status===500&&/ANTHROPIC_API_KEY/.test(j.error||''))el.innerHTML='<div class="err">❌ ANTHROPIC_API_KEY ontbreekt bij Supabase → Edge Functions → Secrets</div>';else if(res.status===401)el.innerHTML='<div class="err">❌ Sessie niet geaccepteerd: '+esc(j.error||'')+'</div>';else el.innerHTML='<div class="'+(res.ok?'ok':'err')+'">Antwoord '+res.status+': '+esc(j.error||JSON.stringify(j).slice(0,120))+'</div>'}catch(e){el.innerHTML='<div class="err">❌ '+esc(e.message)+' — is de function "lees-factuur" gedeployed?</div>'}}
async function wipeAll(){if(!confirm('Echt ALLES wissen? Dit kan niet ongedaan worden gemaakt.'))return;if(!confirm('Laatste waarschuwing: alle facturen, bank en bijlagen van alle bedrijven worden verwijderd.'))return;const ids=[...S.purchases,...S.sales].filter(p=>p.fileId).map(p=>p.fileId);if(ids.length)await sb.storage.from('bijlagen').remove(ids);S.purchases=[];S.sales=[];S.bank=[];await syncNow();location.reload()}
async function logout(){await sb.auth.signOut();location.reload()}

/* ================== START / LOGIN ================== */
async function login(){const em=document.getElementById('lockem').value.trim(),pw=document.getElementById('lockpw').value;const err=document.getElementById('lockerr');err.textContent='Inloggen…';const {error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error){err.textContent='Inloggen mislukt: '+(error.message==='Invalid login credentials'?'onjuist e-mailadres of wachtwoord':error.message);return}err.textContent='';await boot()}
async function boot(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session){document.getElementById('lock').style.display='flex';setTimeout(()=>document.getElementById('lockem').focus(),100);return}
 S.user=session.user;document.getElementById('lock').style.display='none';
 try{await load()}catch(e){toast('❌ Laden mislukt: '+esc(e.message),8000);return}
 fillCompanies();route();setSyncState('ok');
 if(!isOwner())document.querySelectorAll('.drop').forEach(d=>d.style.display='none');
}
sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT'){document.getElementById('lock').style.display='flex'}});
boot();
document.addEventListener('paste',e=>{const items=[...(e.clipboardData?.items||[])].filter(i=>i.type.startsWith('image/')).map(i=>i.getAsFile());if(items.length&&!document.getElementById('invModal').classList.contains('open'))handleFiles(items)});
</script>
