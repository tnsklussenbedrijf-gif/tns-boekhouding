<style>
:root{--blue:#1d4ed8;--blue-d:#1e40af;--blue-l:#dbeafe;--bg:#f3f6fb;--card:#fff;--txt:#111827;--muted:#6b7280;--line:#e5e7eb;--green:#059669;--red:#dc2626;--amber:#d97706;--r:12px}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:var(--txt);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue-l);border-color:var(--blue)}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field{margin-bottom:12px}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.btn{background:var(--blue);color:#fff;border:0;padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--blue-d)}
.btn.sec{background:#fff;color:var(--blue);border:1px solid #bfdbfe}.btn.sec:hover{background:var(--blue-l)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}.btn.ghost:hover{background:#f9fafb}
.btn.danger{background:#fff;color:var(--red);border:1px solid #fecaca}.btn.danger:hover{background:#fef2f2}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
a.btn{text-decoration:none}
#app{display:flex;min-height:100vh}
aside{width:230px;background:#0f172a;color:#cbd5e1;padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;flex-shrink:0}
.logo{color:#fff;font-weight:800;font-size:18px;letter-spacing:.3px;padding:6px 10px 16px}
.logo small{display:block;color:#64748b;font-weight:500;font-size:11px;margin-top:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#cbd5e1;text-decoration:none;font-weight:500;margin-bottom:2px}
.nav a:hover{background:#1e293b;color:#fff}.nav a.active{background:var(--blue);color:#fff}
.nav a .ic{width:18px;text-align:center;opacity:.9}
.nav .badge{margin-left:auto;background:#f59e0b;color:#111;font-size:11px;padding:1px 7px;border-radius:10px;font-weight:700}

.compsel select{background:#1e293b;color:#fff;border-color:#334155}
main{flex:1;padding:22px 28px;max-width:1300px;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px;flex-wrap:wrap}
h1{font-size:22px;margin:0}h2{font-size:16px;margin:0 0 12px}h3{font-size:14px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.grid{display:grid;gap:14px}.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}.kpi .v{font-size:24px;font-weight:800;margin-top:4px}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}

tr:hover td{background:#f8fafc}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

.aibox{display:flex;align-items:center;gap:12px;padding:12px 14px;background:linear-gradient(90deg,#eef2ff,#eff6ff);border:1px solid #c7d2fe;border-radius:10px;margin-bottom:12px}
.spin{width:18px;height:18px;border:3px solid #c7d2fe;border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;flex-shrink:0}
@keyframes sp{to{transform:rotate(360deg)}}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}.filters>*{width:auto;min-width:120px}
.toast{position:fixed;bottom:20px;right:20px;background:#0f172a;color:#fff;padding:12px 18px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:99;display:none;max-width:400px}
.toast.show{display:block}
.btwtable td:first-child{font-weight:600}.btwtable .rub{color:var(--muted);font-weight:700;width:50px}
.sub{color:var(--muted);font-size:12px}
.chk{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--txt);font-size:13px}.chk input{width:auto}
.link{color:var(--blue);cursor:pointer;text-decoration:underline;background:none;border:0;padding:0;font-size:inherit}
.thumb{width:36px;height:36px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:pointer;background:#f1f5f9;display:inline-flex;align-items:center;justify-content:center;font-size:16px}
.steps{display:flex;gap:6px;margin-bottom:12px;font-size:12px}
.steps span{padding:4px 10px;border-radius:999px;background:#f1f5f9;color:var(--muted)}.steps span.on{background:var(--blue);color:#fff}
.matchbox{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px;background:#f8fafc;font-size:12px}
.hamb{display:none}
@media(max-width:760px){aside{position:fixed;left:-240px;z-index:40;transition:.2s}aside.open{left:0}main{padding:14px}.hamb{display:inline-block}}
@media print{aside,.topbar .actions,.noprint{display:none!important}main{padding:0}body{background:#fff}.card{border:0}}
.lock{position:fixed;inset:0;background:#0f172a;display:flex;align-items:center;justify-content:center;z-index:100}
.lock .box{background:#fff;padding:30px;border-radius:16px;width:340px;text-align:center}
</style>

<script>
/* ================== SUPABASE CONFIG ================== */
const SUPABASE_URL='https://beujkjbaaurklckmwwzi.supabase.co';
const SUPABASE_KEY='sb_publishable_1eNsuiQbC1QAm_f23ltmJQ_36cYVvJA';
if(!window.supabase){document.body.innerHTML='<div style="padding:40px;font-family:sans-serif"><h2>Kan supabase-js niet laden</h2>Controleer je internetverbinding en herlaad de pagina.</div>';throw new Error('supabase-js niet geladen')}
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const CATS=['Materiaal','Onderaannemer','Gereedschap','Auto & brandstof','Huur & huisvesting','Telefoon & internet','Software & abonnementen','Marketing','Verzekering','Kantoor','Representatie','Bankkosten','Overig'];
let S={companies:[],active:'tns',purchases:[],sales:[],bank:[],settings:{model:'claude-sonnet-4-6',autoRead:true,reminders:{}},role:'accountant',user:null};
const isOwner=()=>S.role==='owner';
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

/* ---- Laden uit Supabase ---- */
const snap={inv:{},bank:{},comp:{},settings:''};
function invRow(i){return{id:i.id,company:i.company,type:i.type,date:i.date||null,status:i.status||'open',needs_check:!!i.needsCheck,file_id:i.fileId||null,data:i,updated_at:new Date().toISOString()}}
function bankRow(b){return{id:b.id,company:b.company,date:b.date||null,amount:b.amount,match_id:b.matchId||null,data:b,updated_at:new Date().toISOString()}}
function takeSnapshot(){snap.inv={};snap.bank={};snap.comp={};[...S.purchases,...S.sales].forEach(i=>snap.inv[i.id]=JSON.stringify(i));S.bank.forEach(b=>snap.bank[b.id]=JSON.stringify(b));S.companies.forEach(c=>snap.comp[c.id]=JSON.stringify(c));snap.settings=JSON.stringify(S.settings)}
async function load(){
 const [c,i,b,st,pr]=await Promise.all([
  sb.from('bh_companies').select('*').order('sort'),
  sb.from('bh_invoices').select('data'),
  sb.from('bh_bank').select('data'),
  sb.from('bh_settings').select('*').eq('key','app').maybeSingle(),
  sb.from('bh_profiles').select('role').eq('user_id',S.user.id).maybeSingle()
 ]);
 if(c.error)throw new Error('Bedrijven laden: '+c.error.message);
 S.companies=c.data.map(x=>({id:x.id,name:x.name,short:x.short||x.name,kvk:x.kvk||'',btwnr:x.btwnr||'',iban:x.iban||'',sort:x.sort||0}));
 const inv=(i.data||[]).map(x=>x.data);
 S.purchases=inv.filter(x=>x.type==='purchase');S.sales=inv.filter(x=>x.type==='sale');
 [S.purchases,S.sales].forEach(l=>l.sort((a,b)=>(b.date||'').localeCompare(a.date||'')));
 S.bank=(b.data||[]).map(x=>x.data);S.bank.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
 S.settings=Object.assign({model:'claude-sonnet-4-6',autoRead:true,reminders:{}},st.data?.value||{});if(!S.settings.reminders)S.settings.reminders={};
 S.role=pr.data?.role||'accountant';
 try{const a=localStorage.getItem('tnsbh_active');if(a&&S.companies.find(x=>x.id===a))S.active=a}catch(e){}
 if(!S.companies.find(x=>x.id===S.active))S.active=S.companies[0]?.id||'tns';
 takeSnapshot();
}
/* ---- Opslaan: vergelijk met snapshot, schrijf alleen wijzigingen ---- */
let saveT=null,saving=false,saveAgain=false;
function save(){try{localStorage.setItem('tnsbh_active',S.active)}catch(e){}if(!isOwner())return;clearTimeout(saveT);saveT=setTimeout(syncNow,250)}
async function syncNow(){
 if(saving){saveAgain=true;return}saving=true;setSyncState('busy');
 try{
  const invs=[...S.purchases,...S.sales];const upI=[],delI=[];const seen={};
  invs.forEach(i=>{seen[i.id]=1;const j=JSON.stringify(i);if(snap.inv[i.id]!==j)upI.push(invRow(i))});
  Object.keys(snap.inv).forEach(id=>{if(!seen[id])delI.push(id)});
  const upB=[],delB=[];const seenB={};
  S.bank.forEach(b=>{seenB[b.id]=1;const j=JSON.stringify(b);if(snap.bank[b.id]!==j)upB.push(bankRow(b))});
  Object.keys(snap.bank).forEach(id=>{if(!seenB[id])delB.push(id)});
  const upC=[],delC=[];const seenC={};
  S.companies.forEach(c=>{seenC[c.id]=1;if(snap.comp[c.id]!==JSON.stringify(c))upC.push({id:c.id,name:c.name,short:c.short,kvk:c.kvk,btwnr:c.btwnr,iban:c.iban,sort:c.sort||0})});
  Object.keys(snap.comp).forEach(id=>{if(!seenC[id])delC.push(id)});
  const ops=[];
  if(upC.length)ops.push(sb.from('bh_companies').upsert(upC));
  for(let k=0;k<upI.length;k+=200)ops.push(sb.from('bh_invoices').upsert(upI.slice(k,k+200)));
  for(let k=0;k<upB.length;k+=200)ops.push(sb.from('bh_bank').upsert(upB.slice(k,k+200)));
  // Verwijderen in kleine batches: een .in('id',[...]) met honderden id's maakt een zeer lange
  // request-URL die door de server/proxy geweigerd kan worden (bv. "URI too long"). Dat leverde
  // eerder een stille sync-fout op waarna een pagina-ververs de "verwijderde" rijen weer terugbracht.
  const DELCHUNK=80;
  for(let k=0;k<delI.length;k+=DELCHUNK)ops.push(sb.from('bh_invoices').delete().in('id',delI.slice(k,k+DELCHUNK)));
  for(let k=0;k<delB.length;k+=DELCHUNK)ops.push(sb.from('bh_bank').delete().in('id',delB.slice(k,k+DELCHUNK)));
  for(let k=0;k<delC.length;k+=DELCHUNK)ops.push(sb.from('bh_companies').delete().in('id',delC.slice(k,k+DELCHUNK)));
  if(snap.settings!==JSON.stringify(S.settings))ops.push(sb.from('bh_settings').upsert({key:'app',value:S.settings,updated_at:new Date().toISOString()}));
  const res=await Promise.all(ops);const err=res.find(r=>r&&r.error);
  if(err)throw new Error(err.error.message);
  takeSnapshot();setSyncState('ok');
 }catch(e){
  console.error(e);setSyncState('err');
  // Bewust géén auto-verdwijnend toastje: als opslaan mislukt (bv. na een grote verwijderactie)
  // mag de gebruiker dit niet missen en de pagina verversen — dat zou de mislukte wijziging weer
  // ongedaan maken doordat de oude data uit de cloud opnieuw geladen wordt.
  toast('⚠️ Opslaan in cloud mislukt: '+esc(e.message)+'. Ververs of sluit deze pagina NIET — probeer het opnieuw of wacht tot het vanzelf lukt.',15000);
  // Automatisch opnieuw proberen (bv. bij een tijdelijk netwerkprobleem of een te lange
  // verwijder-opdracht die na het opsplitsen alsnog faalt), zodat de gebruiker niet zelf iets
  // hoeft te doen én niet in de verleiding komt om te verversen.
  clearTimeout(saveT);saveT=setTimeout(syncNow,4000);
 }
 saving=false;if(saveAgain){saveAgain=false;syncNow()}
}
window.addEventListener('beforeunload',(e)=>{const el=document.getElementById('syncState');if(el&&el.style.color==='rgb(248, 113, 113)'){e.preventDefault();e.returnValue='Niet alle wijzigingen zijn opgeslagen in de cloud. Weet je zeker dat je wilt sluiten?';return e.returnValue}});
function setSyncState(s){const el=document.getElementById('syncState');if(!el)return;el.textContent=s==='busy'?'⟳ opslaan…':s==='ok'?'✓ opgeslagen':'⚠ NIET opgeslagen — niet verversen!';el.style.color=s==='err'?'#f87171':'#64748b'}
/* ---- Bijlagen in Supabase Storage ---- */
const fileCache={};
async function putFile(id,obj){const {error}=await sb.storage.from('bijlagen').upload(id,obj.blob,{contentType:obj.type||'application/octet-stream',upsert:true});if(error)throw new Error('Upload mislukt: '+error.message);fileCache[id]={blob:obj.blob,type:obj.type,name:obj.name}}
async function getFile(id){if(!id)return null;if(fileCache[id])return fileCache[id];const {data,error}=await sb.storage.from('bijlagen').download(id);if(error||!data)return null;const f={blob:data,type:data.type||'application/octet-stream',name:id};fileCache[id]=f;return f}
async function delFile(id){if(!id)return;delete fileCache[id];try{await sb.storage.from('bijlagen').remove([id])}catch(e){}}
async function allFiles(){const out={};const ids=[...S.purchases,...S.sales].filter(p=>p.fileId).map(p=>p.fileId);for(const id of ids){const f=await getFile(id);if(f)out[id]=f}return out}

/* ================== HELPERS ================== */
const fmt=n=>(Number(n)||0).toLocaleString('nl-NL',{style:'currency',currency:'EUR'});
const r2=n=>Math.round((Number(n)||0)*100)/100;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(m,ms=3200){const t=document.getElementById('toast');t.innerHTML=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),ms)}

function quarterOf(d){return Math.floor((parseInt(d.slice(5,7))-1)/3)+1}
function inPeriod(d,year,q){if(!d)return false;if(d.slice(0,4)!==String(year))return false;if(q==='all')return true;if(String(q).startsWith('m'))return parseInt(d.slice(5,7))===parseInt(q.slice(1));return quarterOf(d)===Number(q)}
function parseNum(v){if(v==null||v==='')return 0;if(typeof v==='number')return v;let s=String(v).trim().replace(/[€\s]/g,'');if(/,\d{1,2}$/.test(s))s=s.replace(/\./g,'').replace(',','.');else if(/\.\d{1,2}$/.test(s))s=s.replace(/,/g,'');else s=s.replace(/[.,]/g,'');const n=parseFloat(s);return isNaN(n)?0:n}
function normDate(v){if(!v)return'';v=String(v).trim();let m;if((m=v.match(/^(\d{4})-(\d{2})-(\d{2})/)))return `${m[1]}-${m[2]}-${m[3]}`;if((m=v.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/)))return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;if((m=v.match(/^(\d{4})(\d{2})(\d{2})$/)))return `${m[1]}-${m[2]}-${m[3]}`;if((m=v.match(/^(\d{2})(\d{2})(\d{2})$/)))return `20${m[1]}-${m[2]}-${m[3]}`;return''}
function download(name,content,type='text/plain'){const b=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

function vatTotals(lines){let net=0,vat=0;(lines||[]).forEach(l=>{net+=Number(l.net)||0;vat+=Number(l.vat)||0});return{net:r2(net),vat:r2(vat),gross:r2(net+vat)}}

 ${recent.length?recent.map(p=>{const t=vatTotals(p.lines);return `<tr style="cursor:pointer" onclick="openInvoice('${p.t==='in'?'purchase':'sale'}','${p.id}')"><td><span class="tag ${p.t==='in'?'gr':'b'}">${p.t==='in'?'Inkoop':'Verkoop'}</span></td><td>${fdate(p.date)}</td><td>${esc(p.party)}</td><td>${esc(p.nr)}</td><td class="num">${fmt(t.net)}</td><td class="num">${fmt(t.vat)}</td><td class="num"><b>${fmt(t.gross)}</b></td><td>${statusTag(p)}</td></tr>`}).join(''):'<tr><td colspan="8" class="empty">Nog niets toegevoegd</td></tr>'}</table></div></div>`;

<script>
/* ================== BESTANDEN & AI LEZEN ================== */
async function compressImage(file){
 if(!file.type.startsWith('image/'))return file;
 try{const bmp=await createImageBitmap(file);const max=2000;let w=bmp.width,h=bmp.height;const sc=Math.min(1,max/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(bmp,0,0,w,h);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.86));return blob||file}catch(e){return file}
}
function blobToB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)})}
function newInvoice(type){return{id:uid(),company:S.active,type,party:'',partyBtw:'',partyEmail:'',nr:'',date:today(),due:'',lines:[{rate:21,net:0,vat:0}],cat:type==='purchase'?'Materiaal':'Omzet',desc:'',status:'open',paidDate:'',payMethod:'',vatDeductible:true,needsCheck:false,fileId:null,fileType:'',fileName:'',created:new Date().toISOString(),ai:null,reverse:false,reminders:[]}}
const PAY_METHODS=[['','Onbekend'],['bank','Bank / overgemaakt'],['contant','Contant'],['pin','Pin'],['creditcard','Creditcard'],['anders','Anders']];
function payMethodTag(p){const lbl={bank:'🏦 Bank',contant:'💶 Contant',pin:'💳 Pin',creditcard:'💳 Creditcard',anders:'Anders'}[p.payMethod]||'';if(lbl)return`<span class="tag gr" title="Betaalwijze">${lbl}</span>`;if(p.ai)return`<span class="tag gr" title="De AI kon de betaalwijze niet met zekerheid op de bon/factuur vinden">❔ Betaalwijze onbekend</span>`;return''}
function unknownAccountTag(p){return p.unknownAccount?`<span class="tag a" title="Op de bon/factuur staat een ander rekeningnummer dan onze eigen bankrekening (${esc(p.docIban||'')}). Controleer of dit wel bij onze administratie hoort.">❓ Onbekende bon (andere rekening)</span>`:''}
function findDup(inv){const g=r2(vatTotals(inv.lines).gross);const party=(inv.party||'').trim().toLowerCase();const nr=(inv.nr||'').trim().toLowerCase();return listOf(inv.type).find(x=>x.id!==inv.id&&x.company===inv.company&&(( nr&&(x.nr||'').trim().toLowerCase()===nr&&(x.party||'').trim().toLowerCase()===party)||(g&&Math.abs(vatTotals(x.lines).gross-g)<0.01&&x.date===inv.date&&(x.party||'').trim().toLowerCase()===party)))||null}
const SCHEMES=[['normal','Normaal (btw op factuur)'],['nl_reverse','BTW verlegd — binnenland (bouw/onderaanneming)'],['eu','EU — btw verlegd (ICP)'],['non_eu','Buiten EU (export/import)']];
function invoiceChecks(i){const w=[];if(!i.nr)w.push('factuurnummer ontbreekt (moet doorlopend/uniek zijn)');if(!i.date)w.push('factuurdatum ontbreekt');if(!i.party)w.push(i.type==='sale'?'naam klant ontbreekt':'naam leverancier ontbreekt');const sch=schemeOf(i);if(sch!=='normal'&&!i.partyBtw)w.push('btw-nummer van de tegenpartij is verplicht bij btw verlegd');if(sch==='normal'&&i.lines.some(l=>l.rate>0&&l.net>0&&!l.vat))w.push('btw-bedrag ontbreekt bij een belast tarief');if(i.type==='sale'&&!i.fileId)w.push('geen factuurkopie bijgevoegd (bewaarplicht 7 jaar)');return w}
function schemeOf(i){return i.vatScheme||(i.reverse?'nl_reverse':'normal')}
function moveInv(inv,type){if(inv.type===type)return;S.purchases=S.purchases.filter(x=>x.id!==inv.id);S.sales=S.sales.filter(x=>x.id!==inv.id);inv.type=type;inv.cat=type==='purchase'?(CATS.includes(inv.cat)?inv.cat:'Materiaal'):'Omzet';listOf(type).unshift(inv)}
function listOf(type){return type==='purchase'?S.purchases:S.sales}
function findInv(id){return S.purchases.find(p=>p.id===id)||S.sales.find(p=>p.id===id)}

async function handleFiles(files,type='purchase'){
 if(!isOwner()){toast('Alleen-lezen account: uploaden niet mogelijk');return}
 files=[...files].filter(f=>f.type.startsWith('image/')||f.type==='application/pdf');
 if(!files.length){toast('Alleen foto\'s (JPG/PNG) of PDF');return}
 const list=listOf(type);const created=[];let done=0;
 const batchCompany=S.active; /* vastzetten bij start: als je halverwege een grote upload van bedrijf wisselt, moeten deze bestanden toch bij het juiste bedrijf terechtkomen */
 const prog=(msg)=>toast(msg,120000);
 prog(`⬆ Uploaden 0/${files.length}…`);
 // uploaden, 3 tegelijk
 await runPool(files,3,async f=>{
  const blob=await compressImage(f);const fid=uid();
  try{await putFile(fid,{blob,type:blob.type||f.type,name:f.name})}catch(e){toast('❌ '+esc(f.name)+': '+esc(e.message),6000);return}
  const inv=newInvoice(type);inv.company=batchCompany;inv.fileId=fid;inv.fileType=blob.type||f.type;inv.fileName=f.name;inv.needsCheck=true;inv.party=f.name.replace(/\.[^.]+$/,'');
  list.unshift(inv);created.push(inv);done++;prog(`⬆ Uploaden ${done}/${files.length}…`);
 });
 save();if(!created.length)return;
 if(S.settings.autoRead){
  let read=0;prog(`🤖 AI leest 0/${created.length}…`);
  await runPool(created,3,async inv=>{try{await aiRead(inv)}catch(e){inv.ai={error:e.message};inv.aiHint='AI-lezen mislukt: '+e.message}read++;prog(`🤖 AI leest ${read}/${created.length}…`);if(read%5===0)save()});
  save();
 }
 const perQ={};created.forEach(i=>{const k=i.date?`Q${quarterOf(i.date)} ${i.date.slice(0,4)}`:'?';perQ[k]=(perQ[k]||0)+1});const nS=created.filter(i=>i.type==='sale').length,nP=created.length-nS,nB=created.filter(i=>i.docType==='bon').length;
 const dups=created.filter(i=>findDup(i)).length;
 toast(`✅ ${created.length} verwerkt → ${nP} inkoop (${nB} bonnen), ${nS} verkoop · ${Object.entries(perQ).map(([k,v])=>k+': '+v).join(', ')}${dups?` · <b style="color:#fca5a5">🚫 ${dups} mogelijk dubbel</b>`:''} — controleer ze nu één voor één`,9000);
 const page=type==='purchase'?'inkoop':'verkoop';
 if(cur!==page)location.hash='#'+page;else render();
 reviewQueue=created.map(i=>i.id);
 const first=created[created.length-1];openInvoice(first.type,first.id,false);
}
/* ================== SNELSCAN (telefoon) ================== */
let snapItems=[];let aiSlots=0;const AI_MAX=3;const aiWait=[];
function aiAcquire(){return new Promise(res=>{if(aiSlots<AI_MAX){aiSlots++;res()}else aiWait.push(res)})}
function aiRelease(){aiSlots--;const n=aiWait.shift();if(n){aiSlots++;n()}}
function snapAdd(files){if(!isOwner()){toast('Alleen-lezen account');return}[...files].filter(f=>f.type.startsWith('image/')||f.type==='application/pdf').forEach(f=>processSnap(f))}
async function processSnap(f){
 const inv=newInvoice('purchase');inv.needsCheck=true;inv.party='';inv.fileName=f.name;inv.fileId=uid();inv.fileType='image/jpeg';
 const it={id:inv.id,name:f.name,status:'upload',msg:'uploaden…',thumb:URL.createObjectURL(f)};snapItems.unshift(it);S.purchases.unshift(inv);renderSnapList();
 try{const blob=await compressImage(f);inv.fileType=blob.type||f.type;await putFile(inv.fileId,{blob,type:inv.fileType,name:f.name});save();
  if(S.settings.autoRead){it.status='ai';it.msg='AI leest…';renderSnapList();await aiAcquire();try{await aiRead(inv)}finally{aiRelease()}
   const live=findInv(inv.id)||inv;it.status=findDup(live)?'dup':'done';it.msg=(live.party||'?')+' · '+fmt(vatTotals(live.lines).gross)+(live.date?' · Q'+quarterOf(live.date):'')+(live.type==='sale'?' · verkoop':'')+(it.status==='dup'?' · 🚫 dubbel?':'');}
  else{it.status='done';it.msg='geüpload (nog lezen)'}
 }catch(e){it.status='error';it.msg='❌ '+e.message;inv.aiHint='Verwerken mislukt: '+e.message}
 save();renderSnapList();
}
function renderSnapList(){const el=document.getElementById('snapList');if(!el)return;const busy=snapItems.filter(x=>x.status==='upload'||x.status==='ai').length,done=snapItems.filter(x=>x.status==='done'||x.status==='dup').length,err=snapItems.filter(x=>x.status==='error').length;
 const c=document.getElementById('snapCount');if(c)c.innerHTML=`<b>${snapItems.length}</b> foto's · ${done} gelezen${busy?` · <span class="spin" style="display:inline-block;width:12px;height:12px;vertical-align:middle"></span> ${busy} bezig`:''}${err?` · <span class="neg">${err} fout</span>`:''}`;

async function runPool(items,n,fn){let i=0;const w=[];for(let k=0;k<Math.min(n,items.length);k++)w.push((async()=>{while(i<items.length){const it=items[i++];await fn(it)}})());await Promise.all(w)}
let reviewQueue=[];
function nextToCheck(type){const ids=reviewQueue.filter(id=>{const x=findInv(id);return x&&x.needsCheck});if(ids.length)return findInv(ids[0]);return listOf(type).find(x=>x.company===S.active&&x.needsCheck)||listOf(type==='sale'?'purchase':'sale').find(x=>x.company===S.active&&x.needsCheck)||null}

const AI_PROMPT=`Je bent een Nederlandse boekhoudassistent. Lees deze factuur/bon en geef ALLEEN geldige JSON terug (geen uitleg, geen markdown):
{"document_type":"inkoopfactuur|verkoopfactuur|bon|creditnota|anders",
"supplier":"naam leverancier/afzender",
"supplier_btw":"btw-nummer afzender of leeg",
"customer":"naam ontvanger/klant of leeg",
"customer_email":"e-mailadres van de klant/ontvanger, alleen als dat letterlijk op de factuur staat, anders leeg",
"invoice_number":"factuur- of bonnummer",
"invoice_date":"YYYY-MM-DD",
"due_date":"YYYY-MM-DD of leeg",
"currency":"EUR",
"vat_lines":[{"rate":21,"net":0.00,"vat":0.00}],
"total_excl":0.00,"total_vat":0.00,"total_incl":0.00,
"vat_reverse_charged":false,
"category":"een van: ${CATS.join(', ')}",
"description":"korte omschrijving van wat gekocht is (max 10 woorden)",
"payment_method":"bank|contant|pin|creditcard|onbekend — kijk op de bon/factuur naar tekst zoals 'CONTANT', 'PIN', 'PINNEN', 'Creditcard', 'iDEAL', 'Bank', 'Overgemaakt', 'Betaald via bank'. Staat er niets over betaalwijze: onbekend.",
"iban_on_document":"het IBAN-rekeningnummer dat op de bon/factuur staat als rekening waarnaar/waarvandaan betaald is (bv. bij 'Betaald via bank' of in de betaalgegevens), zonder spaties, in hoofdletters. Leeg als er geen IBAN op de bon/factuur staat.",
"confidence":0.0,
"notes":"opmerkingen, bv onleesbaar of twijfel"}
Regels: bedragen als getallen met punt als decimaal. Splits per btw-tarief (21, 9, 0). Bij 'btw verlegd' zet vat_reverse_charged true en rate 0. Bij een creditnota: bedragen negatief. Als een bedrag niet leesbaar is: bereken het uit de andere bedragen. total_incl moet gelijk zijn aan total_excl + total_vat.`;

async function aiRead(inv){
 if(!inv.fileId)throw new Error('Geen bijlage');
 const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Niet ingelogd');
 const res=await fetch(SUPABASE_URL+'/functions/v1/lees-factuur',{method:'POST',headers:{'content-type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+session.access_token},body:JSON.stringify({fileId:inv.fileId,model:S.settings.model||'claude-sonnet-4-6'})});
 let j;try{j=await res.json()}catch(e){throw new Error('Serverfout '+res.status)}
 if(!res.ok||j.error)throw new Error(j.error||('Serverfout '+res.status));
 applyAi(inv,j.result);return j.result;
}
function applyAi(inv,d){
 inv.ai={confidence:d.confidence,notes:d.notes,docType:d.document_type,readAt:new Date().toISOString()};
 const own=x=>{const n=normS(x),c=comp();if(!n)return false;const a=normS(c.name),b=normS(c.short);return (a&&(n.includes(a)||a.includes(n)))||(b&&b.length>3&&(n.includes(b)||b.includes(n)))};
 const isSale=inv.type==='sale'||d.document_type==='verkoopfactuur'||own(d.supplier);
 let party=isSale?(d.customer||d.supplier):(d.supplier||d.customer);
 if(own(party))party=isSale?d.supplier:d.customer;/* AI verwisselde afzender/ontvanger */
 if(own(party))party='';
 inv.party=party||inv.party;
 inv.docType=(['bon','inkoopfactuur','verkoopfactuur','creditnota'].includes(d.document_type)?d.document_type:'anders');
 /* automatisch indelen inkoop/verkoop */
 const looksSale=d.document_type==='verkoopfactuur'||(own(d.supplier)&&!own(d.customer));
 const looksPurchase=d.document_type==='inkoopfactuur'||d.document_type==='bon'||(own(d.customer)&&!own(d.supplier));
 if(inv.type==='purchase'&&looksSale&&!looksPurchase){moveInv(inv,'sale');inv.aiHint='Automatisch ingedeeld als VERKOOP (factuur van je eigen bedrijf).'}
 else if(inv.type==='sale'&&looksPurchase&&!looksSale){moveInv(inv,'purchase');inv.aiHint='Automatisch ingedeeld als INKOOP (factuur/bon van een leverancier).'}
 if(inv.type==='sale'){inv.party=own(inv.party)?(d.customer||''):inv.party;if(!inv.party&&d.customer&&!own(d.customer))inv.party=d.customer;if(!['Omzet','Omzet diensten','Omzet materiaal','Overig'].includes(inv.cat))inv.cat='Omzet'}
 inv.partyBtw=isSale?(own(d.supplier)?'':d.supplier_btw||''):(d.supplier_btw||'');inv.partyEmail=(d.customer_email||inv.partyEmail||'').trim();inv.nr=d.invoice_number||'';inv.date=normDate(d.invoice_date)||inv.date;inv.due=normDate(d.due_date)||'';
 inv.reverse=!!d.vat_reverse_charged;
 let lines=(d.vat_lines||[]).map(l=>({rate:[21,9,0].includes(Number(l.rate))?Number(l.rate):21,net:r2(parseNum(l.net)),vat:r2(parseNum(l.vat))})).filter(l=>l.net||l.vat);
 const ti=r2(parseNum(d.total_incl)),te=r2(parseNum(d.total_excl)),tv=r2(parseNum(d.total_vat));
 if(!lines.length){ if(te||tv)lines=[{rate:te&&tv?Math.round(tv/te*100):21,net:te,vat:tv}]; else if(ti){lines=[{rate:21,net:r2(ti/1.21),vat:r2(ti-ti/1.21)}]} else lines=[{rate:21,net:0,vat:0}]; }
 lines.forEach(l=>{if(![21,9,0].includes(l.rate))l.rate=21});
 const t=vatTotals(lines);inv.aiWarn='';
 if(ti&&Math.abs(t.gross-ti)>0.05)inv.aiWarn=`Som van btw-regels (${fmt(t.gross)}) wijkt af van totaal op factuur (${fmt(ti)}). Controleer de bedragen.`;
 inv.lines=lines;
 if(CATS.includes(d.category))inv.cat=d.category;
 inv.desc=d.description||inv.desc;inv.needsCheck=true;
 const pm=['bank','contant','pin','creditcard'].includes(d.payment_method)?d.payment_method:'';if(pm)inv.payMethod=pm;
 /* Contant/pin/creditcard betaalde bonnen verschijnen nooit op de zakelijke bank — meteen als betaald markeren zodat ze niet als "nog niet gezien op bank" blijven hangen */
 if(['contant','pin','creditcard'].includes(inv.payMethod)&&!inv.bankRef&&inv.status!=='betaald'){inv.status='betaald';inv.paidDate=inv.paidDate||inv.date}
 /* Staat er een IBAN op de bon/factuur die NIET van ons eigen bedrijf is (terwijl de betaalwijze "bank" is)?
    Dan is dit waarschijnlijk niet via onze eigen bankrekening betaald — bv. een andere onderneming, een
    privérekening, of een verkeerd gescande bon. Zo'n bon markeren we als "onbekende bon" zodat hij niet
    stilzwijgend meetelt alsof hij via onze rekening is gegaan. */
 const normIban=s=>String(s||'').replace(/[^A-Z0-9]/gi,'').toUpperCase();
 const docIban=normIban(d.iban_on_document);const ownIban=normIban(comp()?.iban);
 inv.docIban=d.iban_on_document||'';
 inv.unknownAccount=!!(inv.payMethod==='bank'&&docIban&&ownIban&&docIban!==ownIban);
 if(d.document_type==='verkoopfactuur')inv.aiHint='AI denkt dat dit een VERKOOPfactuur is (uitgaand). Klopt dat? Wijzig dan het type.';
 if((d.confidence||1)<0.6)inv.aiHint=(inv.aiHint||'')+' Lage zekerheid — controleer alle velden.';
 const dup=findDup(inv);inv.dupOf=dup?dup.id:null;
}

let curInv=null,curBlobUrl=null;
async function openInvoice(type,id,autoAi=false){
 const found=id?findInv(id):null;if(id&&!found){toast('Factuur niet gevonden');return}
 curInv=found?JSON.parse(JSON.stringify(found)):newInvoice(type);
 if(!id)curInv.isNew=true;
 const rest=listOf(curInv.type).filter(x=>x.company===S.active&&x.needsCheck&&x.id!==curInv.id).length;
 document.getElementById('invModalTitle').textContent=(curInv.type==='purchase'?'Inkoopfactuur / bon':'Verkoopfactuur')+(curInv.isNew?' (nieuw)':'')+(rest?` · nog ${rest} te controleren`:'');
 document.getElementById('aiStatus').innerHTML='';
 await showPreview();renderInvForm();openModal('invModal');
 if(autoAi&&curInv.fileId)aiReadCurrent();
}
async function showPreview(){
 const pv=document.getElementById('invPreview');if(curBlobUrl){URL.revokeObjectURL(curBlobUrl);curBlobUrl=null}
 const f=await getFile(curInv.fileId);
 if(!f){pv.innerHTML='<div class="empty">Geen bijlage<br><span class="sub">Voeg een foto of PDF toe om AI te laten lezen</span></div>';return}
 curBlobUrl=URL.createObjectURL(f.blob);
 pv.innerHTML=f.type==='application/pdf'?`<iframe src="${curBlobUrl}"></iframe>`:`<img src="${curBlobUrl}" alt="bijlage">`;
}
async function replaceAttachment(file){if(!file)return;const blob=await compressImage(file);const fid=uid();await putFile(fid,{blob,type:blob.type||file.type,name:file.name});if(curInv.fileId)await delFile(curInv.fileId);curInv.fileId=fid;curInv.fileType=blob.type||file.type;curInv.fileName=file.name;await showPreview();if(S.settings.autoRead)aiReadCurrent()}
async function aiReadCurrent(){
 const st=document.getElementById('aiStatus');
  if(!curInv.fileId){st.innerHTML='<div class="warn">Voeg eerst een bijlage toe.</div>';return}
 readForm();st.innerHTML='<div class="aibox"><div class="spin"></div><div><b>AI leest de factuur…</b><div class="sub">Leverancier, datum, btw-tarieven en bedragen worden herkend</div></div></div>';
 document.getElementById('reReadBtn').disabled=true;
 try{const d=await aiRead(curInv);renderInvForm();st.innerHTML=`<div class="ok">✅ Gelezen (zekerheid ${Math.round((d.confidence||0)*100)}%). <b>Controleer de velden en klik Opslaan.</b>${d.notes?'<div class="sub">'+esc(d.notes)+'</div>':''}${curInv.unknownAccount?`<div class="warn" style="margin-top:6px">❓ Op deze bon/factuur staat een ANDER rekeningnummer (${esc(curInv.docIban)}) dan onze eigen bankrekening. Controleer of dit wel bij onze administratie hoort.</div>`:''}</div>`}
 catch(e){st.innerHTML='<div class="err">❌ AI-lezen mislukt: '+esc(e.message)+'<br><span class="sub">Vul de gegevens handmatig in of probeer opnieuw.</span></div>'}
 document.getElementById('reReadBtn').disabled=false;
}
function renderInvForm(){
 const i=curInv,isP=i.type==='purchase';
 const t=vatTotals(i.lines);
 document.getElementById('invForm').innerHTML=`
 ${(()=>{const d=findDup(i);if(!d)return'';return `<div class="err">🚫 <b>Mogelijk dubbele factuur!</b> Bestaat al: ${esc(d.party)} · nr ${esc(d.nr||'-')} · ${fdate(d.date)} · ${fmt(vatTotals(d.lines).gross)} ${d.needsCheck?'(nog te controleren)':'(goedgekeurd)'}<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn danger sm" onclick="deleteInvoice(true)">Deze verwijderen (dubbel)</button><button class="btn ghost sm" onclick="openInvoice('${d.type}','${d.id}')">Bekijk de andere</button></div></div>`})()}${(()=>{const w=invoiceChecks(i);return w.length?'<div class="warn">📋 <b>Factuureisen Belastingdienst:</b> '+w.map(esc).join(' · ')+'</div>':''})()}${i.aiWarn?'<div class="warn">⚠️ '+esc(i.aiWarn)+'</div>':''}${i.aiHint?'<div class="warn">'+esc(i.aiHint)+'</div>':''}
 <div class="row"><div class="field"><label>Type</label><select id="f_type" onchange="changeType(this.value)"><option value="purchase" ${isP?'selected':''}>Inkoop (kosten)</option><option value="sale" ${!isP?'selected':''}>Verkoop (omzet)</option></select></div>
 <div class="field"><label>Status</label><select id="f_status"><option value="open" ${i.status!=='betaald'?'selected':''}>Open</option><option value="betaald" ${i.status==='betaald'?'selected':''}>Betaald</option></select></div>
 <div class="field"><label>Betaalwijze</label><select id="f_paymethod">${PAY_METHODS.map(([v,l])=>`<option value="${v}" ${i.payMethod===v?'selected':''}>${l}</option>`).join('')}</select></div>
 ${S.companies.length>1?`<div class="field"><label>Bedrijf</label><select id="f_company">${S.companies.map(cc=>`<option value="${cc.id}" ${(i.company||S.active)===cc.id?'selected':''}>${esc(cc.short)}</option>`).join('')}</select></div>`:''}</div>
 <div class="row"><div class="field" style="flex:2"><label>${isP?'Leverancier':'Klant'}</label><input id="f_party" value="${esc(i.party)}" list="partyList"><datalist id="partyList">${[...new Set(listOf(i.type).filter(p=>p.company===S.active).map(p=>p.party))].map(p=>`<option value="${esc(p)}">`).join('')}</datalist></div>
 <div class="field"><label>BTW-nr ${isP?'leverancier':'klant'}</label><input id="f_partyBtw" value="${esc(i.partyBtw)}"></div></div>
 ${!isP?`<div class="row"><div class="field"><label>E-mail klant</label><input id="f_partyEmail" type="email" value="${esc(i.partyEmail||'')}" placeholder="voor betalingsherinneringen"></div></div>`:''}
 <div class="row"><div class="field"><label>Factuurnummer</label><input id="f_nr" value="${esc(i.nr)}"></div><div class="field"><label>Factuurdatum</label><input id="f_date" type="date" value="${i.date}"></div><div class="field"><label>Vervaldatum</label><input id="f_due" type="date" value="${i.due||''}"></div></div>
 <div class="row"><div class="field"><label>${isP?'Kostensoort':'Categorie'}</label><select id="f_cat">${(isP?CATS:['Omzet','Omzet diensten','Omzet materiaal','Overig']).map(c=>`<option ${c===i.cat?'selected':''}>${c}</option>`).join('')}</select></div><div class="field" style="flex:2"><label>Omschrijving</label><input id="f_desc" value="${esc(i.desc)}"></div></div>
 <label>BTW-regels (bedragen excl. btw per tarief)</label>
 <div id="vatLines">${i.lines.map((l,k)=>vatRowHtml(l,k)).join('')}</div>
 <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 10px"><button class="btn ghost sm" onclick="addLine()">+ tarief toevoegen</button>
  <span class="sub">Snel: totaal incl.</span><input id="f_quick" type="number" step="0.01" style="width:110px" placeholder="0,00"><select id="f_quickRate" style="width:80px"><option value="21">21%</option><option value="9">9%</option><option value="0">0%</option></select><button class="btn ghost sm" onclick="quickSplit()">Splits</button></div>
 <div class="row"><div class="field"><label>BTW-regeling (aangifte-rubriek)</label><select id="f_scheme">${SCHEMES.map(([k,l])=>`<option value="${k}" ${schemeOf(i)===k?'selected':''}>${l}</option>`).join('')}</select><div class="sub">${isP?'Verlegd binnenland → rubriek 2a · EU → 4b · buiten EU → 4a':'Verlegd binnenland → rubriek 1e · EU → 3b (+ICP-opgaaf) · buiten EU → 3a'}</div></div>${isP?`<label class="chk"><input type="checkbox" id="f_ded" ${i.vatDeductible!==false?'checked':''}> BTW aftrekbaar (voorbelasting)</label>`:''}</div>
 <div class="totals"><div><span>Subtotaal excl. btw</span><b id="t_net">${fmt(t.net)}</b></div><div><span>BTW</span><b id="t_vat">${fmt(t.vat)}</b></div><div class="big"><span>Totaal incl. btw</span><span id="t_gross">${fmt(t.gross)}</span></div></div>
 <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">${(()=>{const n=listOf(i.type).filter(x=>x.company===S.active&&x.needsCheck&&x.id!==i.id).length;return n?`<button class="btn" onclick="saveInvoice(true)">✅ Opslaan & volgende (${n})</button><button class="btn sec" onclick="saveInvoice()">Opslaan</button>`:`<button class="btn" onclick="saveInvoice()">💾 Opslaan${i.needsCheck?' & goedkeuren':''}</button>`})()}${!i.isNew?'<button class="btn danger" onclick="deleteInvoice()">Verwijderen</button>':''}<button class="btn ghost" onclick="closeModal('invModal')">Annuleren</button></div>`;
}
function vatRowHtml(l,k){return `<div class="vatrow" data-k="${k}"><div><label>Tarief</label><select class="l_rate" onchange="recalcLine(${k},'rate')"><option value="21" ${l.rate==21?'selected':''}>21%</option><option value="9" ${l.rate==9?'selected':''}>9%</option><option value="0" ${l.rate==0?'selected':''}>0%</option></select></div><div><label>Excl. btw</label><input type="number" step="0.01" class="l_net" value="${l.net}" oninput="recalcLine(${k},'net')"></div><div><label>BTW-bedrag</label><input type="number" step="0.01" class="l_vat" value="${l.vat}" oninput="recalcLine(${k},'vat')"></div><button class="btn ghost sm" style="height:36px" onclick="removeLine(${k})">✕</button></div>`}
function readLines(){return [...document.querySelectorAll('#vatLines .vatrow')].map(r=>({rate:Number(r.querySelector('.l_rate').value),net:r2(parseFloat(r.querySelector('.l_net').value)||0),vat:r2(parseFloat(r.querySelector('.l_vat').value)||0)}))}
function recalcLine(k,what){const r=document.querySelector(`#vatLines .vatrow[data-k="${k}"]`);const rate=Number(r.querySelector('.l_rate').value),net=parseFloat(r.querySelector('.l_net').value)||0;if(what!=='vat')r.querySelector('.l_vat').value=r2(net*rate/100);updateTotals()}
function updateTotals(){const t=vatTotals(readLines());document.getElementById('t_net').textContent=fmt(t.net);document.getElementById('t_vat').textContent=fmt(t.vat);document.getElementById('t_gross').textContent=fmt(t.gross)}
function addLine(){readForm();curInv.lines.push({rate:9,net:0,vat:0});renderInvForm()}
function removeLine(k){readForm();curInv.lines.splice(k,1);if(!curInv.lines.length)curInv.lines.push({rate:21,net:0,vat:0});renderInvForm()}
function quickSplit(){const g=parseFloat(document.getElementById('f_quick').value)||0,rate=Number(document.getElementById('f_quickRate').value);if(!g)return;readForm();const net=r2(g/(1+rate/100));curInv.lines=[{rate,net,vat:r2(g-net)}];renderInvForm()}
function changeType(v){readForm();curInv.type=v;curInv.cat=v==='purchase'?'Materiaal':'Omzet';document.getElementById('invModalTitle').textContent=(v==='purchase'?'Inkoopfactuur / bon':'Verkoopfactuur');renderInvForm()}
function readForm(){const g=id=>document.getElementById(id);if(!g('f_party'))return;const i=curInv;i.party=g('f_party').value.trim();i.partyBtw=g('f_partyBtw').value.trim();if(g('f_partyEmail'))i.partyEmail=g('f_partyEmail').value.trim();i.nr=g('f_nr').value.trim();i.date=g('f_date').value;i.due=g('f_due').value;i.cat=g('f_cat').value;i.desc=g('f_desc').value.trim();i.status=g('f_status').value;if(g('f_paymethod'))i.payMethod=g('f_paymethod').value;i.vatScheme=g('f_scheme').value;i.reverse=i.vatScheme!=='normal';if(g('f_ded'))i.vatDeductible=g('f_ded').checked;if(g('f_company'))i.company=g('f_company').value;i.lines=readLines()}
function saveInvoice(andNext){
 if(!isOwner()){toast('Alleen-lezen account');return}
 readForm();const i=curInv;
 if(!i.party){toast('Vul een relatie (leverancier/klant) in');return}
 if(!i.date){toast('Vul een datum in');return}
 if(isLocked(i.date)&&!confirm('Dit tijdvak is al aangegeven bij de Belastingdienst (afgesloten). Wijzigen betekent dat je een suppletie/correctie moet doen.\n\nToch opslaan?'))return;

 if(i.status==='betaald'&&!i.paidDate)i.paidDate=today();if(i.status!=='betaald')i.paidDate='';

<script>
/* ================== BANK IMPORT ================== */
function parseCSVText(text){const delim=(text.match(/;/g)||[]).length>=(text.match(/,/g)||[]).length?';':(text.match(/\t/g)||[]).length>(text.match(/,/g)||[]).length?'\t':',';const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}else{if(c==='"')q=true;else if(c===delim){row.push(cell);cell=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()!==''))rows.push(row);row=[];cell=''}else cell+=c}}row.push(cell);if(row.some(x=>x.trim()!==''))rows.push(row);return rows}
function abnField(s,key){s=s||'';let m=s.match(new RegExp('/'+key+'/([^/]*)','i'));if(m)return m[1].trim();m=s.match(new RegExp(key+':\\s*(.*?)(?:\\s{2,}|$)','i'));return m?m[1].trim():''}
function findCol(h,names){for(const n of names){const i=h.findIndex(x=>x.toLowerCase().replace(/[^a-z0-9]/g,'').includes(n));if(i>=0)return i}return -1}
function parseBankCSV(text){
 const rows=parseCSVText(text);if(rows.length<1)return[];
 const h=rows[0].map(x=>x.trim());
 /* ABN AMRO TAB export zonder header: rek, munt, datum(yyyymmdd), saldo, saldo, rentedatum, bedrag, omschrijving */
 if(rows[0].length>=8&&/^\d{8}$/.test(h[2])&&/^\d{9,10}$/.test(h[0].replace(/\D/g,'')))return rows.map(r=>({date:normDate(r[2]),amount:parseNum(r[6]),name:abnField(r[7],'Naam')||abnField(r[7],'NAME'),desc:abnField(r[7],'Omschrijving')||abnField(r[7],'REMI')||(r[7]||'').trim(),ref:abnField(r[7],'IBAN')})).filter(t=>t.date);
 const iDate=findCol(h,['datum','date','boekdatum','transactiedatum']),iAmt=findCol(h,['bedrageur','bedrag','amount','transactiebedrag']),iAfBij=findCol(h,['afbij','debitcredit','creditdebit','dc']),iName=findCol(h,['naamomschrijving','naamtegenpartij','naam','name','tegenpartij','counterparty']),iDesc=findCol(h,['mededelingen','omschrijving','description','remittance','memo']),iRef=findCol(h,['tegenrekening','tegenrekeningiban','counterpartyiban','iban']);
 if(iDate<0||iAmt<0)throw new Error('Kolommen niet herkend. Verwacht minimaal een Datum- en Bedrag-kolom (ING, Rabobank, ABN AMRO, Knab, Bunq CSV).');
 return rows.slice(1).map(r=>{let amt=parseNum(r[iAmt]);if(iAfBij>=0){const ab=(r[iAfBij]||'').trim().toLowerCase();if(ab==='af'||ab==='debit'||ab==='d')amt=-Math.abs(amt);else if(ab==='bij'||ab==='credit'||ab==='c')amt=Math.abs(amt)}return{date:normDate(r[iDate]),amount:amt,name:iName>=0?(r[iName]||'').trim():'',desc:iDesc>=0?(r[iDesc]||'').trim():'',ref:iRef>=0?(r[iRef]||'').trim():''}}).filter(t=>t.date&&t.amount);
}
function parseMT940(text){
 const out=[];const lines=text.split(/\r?\n/);let cur=null;let in86=false;
 for(const raw of lines){const ln=raw.replace(/\r$/,'');
  if(ln.startsWith(':61:')){if(cur)out.push(cur);in86=false;const m=ln.slice(4).match(/^(\d{6})(\d{4})?(R?[CD])([A-Z])?(\d+,\d{0,2})/);const er=ln.slice(4).match(/N[A-Z]{3}(.*?)(?:\/\/|$)/);cur={date:m?normDate(m[1]):'',amount:m?parseNum(m[5])*(/D$/.test(m[3])?-1:1):0,name:'',desc:'',ref:'',raw:'',eref:er&&er[1]!=='NONREF'?er[1]:''};}
  else if(ln.startsWith(':86:')&&cur){in86=true;cur.raw=ln.slice(4)}
  else if(cur&&in86&&!ln.startsWith(':')&&!/^-$/.test(ln))cur.raw+=ln; /* ING breekt regels af zonder spatie */
  else if(ln.startsWith(':'))in86=false;
 }
 if(cur)out.push(cur);
 out.forEach(t=>{const r=t.raw||'';
  /* ING/SEPA gestructureerd: /CNTP/IBAN/BIC/NAAM/// ... /REMI/USTD//tekst/ */
  let m=r.match(/\/CNTP\/([^\/]*)\/([^\/]*)\/(.*?)\/\//);if(m){t.ref=m[1];t.name=m[3].trim()}
  if(!t.name){m=r.match(/\/NAME\/([^\/]+)/);if(m)t.name=m[1].trim()}
  m=r.match(/\/REMI\/(?:USTD|STRD)?\/*([\s\S]*?)(?=\/(?:PURP|EREF|MARF|CSID|CNTP|TRCD|ORDP|BENM|NAME|RTRN|ULTB|ULTD)\/|\/?$)/);
  if(m)t.desc=m[1].replace(/\/+$/,'').trim();else{m=r.match(/\/REMI\/([^\/]+)/);if(m)t.desc=m[1].trim()}
  if(!t.desc){m=r.match(/OMSCHR\w*:\s*(.*?)(?:\s{2,}|$)/i);if(m)t.desc=m[1].trim()}
  if(!t.name){/* pinbetaling: "BCK*Bouwmarkt van der Oss NLD 04-09-2026 12:59 TERMINALID..." */
   m=t.desc.match(/^(?:BCK\*|CCV\*|GEA\s+)?(.*?)(?:\s+(?:NLD|BEL|DEU)\b|\s+\d{2}-\d{2}-\d{4}|\s+TERMINALID|,PAS|$)/);if(m&&m[1])t.name=m[1].trim().slice(0,60)}
  if(!t.name){m=r.match(/\/NAAM\/([^\/]+)|Naam:\s*(.*?)(?:\s{2,}|$)/i);if(m)t.name=(m[1]||m[2]||'').trim()}
  if(!t.desc&&t.eref)t.desc='Kenmerk '+t.eref;
  if(!t.name)t.name=t.desc.slice(0,40);
  if(!t.ref){const ib=r.match(/[A-Z]{2}\d{2}[A-Z]{4}\d{10}/);if(ib)t.ref=ib[0]}
  delete t.raw;delete t.eref;});
 return out.filter(t=>t.date&&t.amount);
}
/* Herkent een bankmutatie aan datum+bedrag+naam+omschrijving, om dubbele import te voorkomen. */
function bankKey(t){return (t.date||'')+'|'+t.amount+'|'+(t.name||'').slice(0,30)+'|'+(t.desc||'').slice(0,60)}
/* Prullenbak: als je een bankmutatie handmatig verwijdert, bewaren we de volledige rij (per bedrijf) in
   plaats van hem écht weg te gooien. Zo kun je 'm terugzetten als je 'm per ongeluk verwijderde, én komt
   hij niet stilzwijgend terug bij een latere/overlappende bank-import (dat was de reden dat verwijderde
   mutaties eerder "terugkwamen"). */
function bankTrashOf(company){S.settings.bankTrash=S.settings.bankTrash||{};S.settings.bankTrash[company]=S.settings.bankTrash[company]||[];return S.settings.bankTrash[company]}
function trashBank(b){const t=bankTrashOf(b.company);t.push({...b,deletedAt:new Date().toISOString()});if(t.length>1000)t.splice(0,t.length-1000)}
function restoreBankRow(company,id){const t=bankTrashOf(company);const idx=t.findIndex(x=>x.id===id);if(idx<0)return;const [b]=t.splice(idx,1);b.matchId=null;b.matchIds=null;b.ignored=false;S.bank.push(b);S.bank.sort((a,c)=>(c.date||'').localeCompare(a.date||''));save();render();toast('↩ Mutatie teruggezet — koppel hem eventueel opnieuw aan een factuur/bon')}
function viewBankTrash(){const t=bankTrashOf(S.active).slice().reverse();
 if(!t.length){toast('Prullenbak is leeg voor dit bedrijf — er is niets (meer) om terug te zetten.',5000);return}
 genModal(`<div class="modal-h"><h2>🗑️ Verwijderde bankmutaties (${t.length})</h2><button class="btn ghost sm" onclick="closeModal('genModal')">✕ Sluiten</button></div>
 <div class="sub" style="margin-bottom:10px">Dit zijn mutaties die je eerder verwijderd hebt bij dit bedrijf. Zet er een terug als dat per ongeluk was. Ze worden ook automatisch overgeslagen bij een nieuwe bank-import, zodat ze niet vanzelf terugkomen.</div>
 ${t.map(b=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)"><div><b>${esc(b.name||'(geen naam)')}</b> · ${fdate(b.date)} · ${fmt(b.amount)}<div class="sub">${esc((b.desc||'').slice(0,100))}${b.deletedAt?' · verwijderd op '+fdate(b.deletedAt.slice(0,10)):''}</div></div><button class="btn sec sm" onclick="restoreBankRow('${b.company}','${b.id}');closeModal('genModal');viewBankTrash()">↩ Terugzetten</button></div>`).join('')}`)}
async function handleBankFile(file){
 if(!file)return;const text=await file.text();
 let txs;try{txs=/^:20:|^:61:/m.test(text)?parseMT940(text):parseBankCSV(text)}catch(e){toast('❌ '+e.message,6000);return}
 if(!txs.length){toast('Geen mutaties gevonden in bestand');return}
 const existing={};myB().forEach(b=>{const k=bankKey(b);existing[k]=(existing[k]||0)+1});
 const trashCount={};bankTrashOf(S.active).forEach(b=>{const k=bankKey(b);trashCount[k]=(trashCount[k]||0)+1});

  if(existing[k]>0){existing[k]--;return}

  S.bank.push({id:uid(),company:S.active,...t,matchId:null,ignored:false});n++});
 S.bank.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
 const auto=autoMatch();save();
 const miss=myB().filter(b=>!b.matchId&&!b.ignored);const mp=miss.filter(b=>b.amount<0).length,ms=miss.filter(b=>b.amount>0).length;
 toast(`✅ ${n} nieuwe mutaties · ${auto} automatisch gekoppeld · <b>ontbreekt: ${mp} inkoopbon, ${ms} verkoopfactuur</b>${skippedDeleted?` · ${skippedDeleted} eerder door jou verwijderde mutatie(s) overgeslagen (zie 🗑️ Prullenbak om terug te zetten)`:''}`,9000);
 if(cur!=='bank')location.hash='#bank';else render();
}
function normS(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
const PARTY_STOP=['b.v.','bv','v.o.f.','vof','the','van','der','den'];
/* Zoekt de grootste deelverzameling van items (elk {i, gross}) waarvan de som ~ target is (±tol). Werkt tot 16 items. */
function subsetSum(items,target,tol){
 const n=items.length;if(n<2||n>16)return null;
 let bestMask=0,bestCount=0;
 for(let mask=1;mask<(1<<n);mask++){let cnt=0,sum=0;for(let k=0;k<n;k++)if(mask&(1<<k)){cnt++;sum+=items[k].gross}
  if(cnt>=2&&cnt>bestCount&&Math.abs(sum-target)<tol){bestCount=cnt;bestMask=mask}}
 if(!bestMask)return null;
 const grp=[];for(let k=0;k<n;k++)if(bestMask&(1<<k))grp.push(items[k].i);
 return grp;
}
function isNonBankPay(i){return['contant','pin','creditcard'].includes(i.payMethod)}
function candidates(b){const list=b.amount<0?myP():myS();const a=Math.abs(b.amount);const hay=(b.name+' '+b.desc).toLowerCase();const hayN=normS(hay);
 const bd0=new Date(b.date);
 /* een betaling kan niet ver vóór de factuurdatum vallen (max. 14 dagen vooruitbetaling), en niet extreem lang erna (max. ~18 maanden) */
 const plausibleDate=i=>{const id=new Date(i.date);if(isNaN(bd0)||isNaN(id))return true;const dd=(bd0-id)/864e5;return dd>=-14&&dd<=548};
 /* contant/pin/creditcard betaalde bonnen komen nooit op de zakelijke bank terecht — niet als kandidaat voorstellen */
 const open=list.filter(i=>!i.bankRef&&plausibleDate(i)&&!isNonBankPay(i));
 const partyWords=i=>(i.party||'').toLowerCase().split(/\s+/).filter(w=>w.length>3&&!PARTY_STOP.includes(w));
 const nameHit=i=>partyWords(i).some(w=>hay.includes(w));
 const nrHit=i=>{const nr=normS(i.nr);return nr&&nr.length>=4&&hayN.includes(nr)};
 /* alleen matchen als er écht bewijs is in de bank-omschrijving: het factuurnummer óf de klant-/leveranciersnaam
    moet er letterlijk in staan. Puur "het bedrag komt toevallig overeen" is niet genoeg (geeft onzin-matches,
    zeker bij creditnota's met een negatief bedrag) */
 const hasSignal=i=>nrHit(i)||nameHit(i);
 const score=i=>{let sc=0;const bd=new Date(b.date),id=new Date(i.date);const dd=Math.abs((bd-id)/864e5);if(dd<=45)sc+=2;else if(dd<=120)sc+=1;if(nameHit(i))sc+=3;if(nrHit(i))sc+=5;return sc};
 const res=open.filter(i=>hasSignal(i)&&Math.abs(vatTotals(i.lines).gross-a)<0.03).map(i=>({i,sc:score(i)}));
 /* meerdere facturen/bonnen tegelijk betaald: alle factuurnummers die letterlijk in de omschrijving staan bij elkaar optellen
    (bv. "Factuur 2026-0026 2026-0030 2026-0029 2026-0031" — één overschrijving voor 4+ facturen) */
 let grouped=null;
 if(!res.length){

function invRows(list,type){return list.map(p=>{const t=vatTotals(p.lines);const by=r=>p.lines.filter(l=>l.rate==r).reduce((a,l)=>({net:a.net+l.net,vat:a.vat+l.vat}),{net:0,vat:0});const a=by(21),b=by(9),c=by(0);return[comp().short,type==='purchase'?'Inkoop':'Verkoop',fdate(p.date),p.nr,p.party,p.partyBtw,p.cat,p.desc,n(a.net),n(a.vat),n(b.net),n(b.vat),n(c.net),n(t.net),n(t.vat),n(t.gross),({normal:'nee',nl_reverse:'verlegd binnenland',eu:'EU',non_eu:'buiten EU'})[schemeOf(p)],p.vatDeductible===false?'nee':'ja',p.status,fdate(p.paidDate),fdate(p.due),p.fileName||'']});function n(v){return r2(v).toFixed(2).replace('.',',')}}

 else if(kind==='alles')download(`grootboek-${nm}.csv`,csv([EXP_HEAD,...invRows(expPeriodList(myS()),'sale'),...invRows(expPeriodList(myP()),'purchase')]),'text/csv');
 else if(kind==='bank')download(`bank-${nm}.csv`,csv([['Datum','Naam','Omschrijving','Bedrag','Gekoppeld aan','Genegeerd'],...myB().filter(b=>flt.year==='all'||inPeriod(b.date,flt.year,flt.q)).map(b=>{const mIds=b.matchIds&&b.matchIds.length?b.matchIds:(b.matchId?[b.matchId]:[]);const ms=mIds.map(findInv).filter(Boolean);return[fdate(b.date),b.name,b.desc,r2(b.amount).toFixed(2).replace('.',','),ms.map(m=>m.party+' '+m.nr).join(' + '),b.ignored?'ja':'']})]),'text/csv');

async function exportAttachments(){const list=expPeriodList(myP()).concat(expPeriodList(myS())).filter(p=>p.fileId);if(!list.length){toast('Geen bijlagen in deze periode');return}toast(`${list.length} bijlagen worden gedownload…`);for(const p of list){const f=await getFile(p.fileId);if(!f)continue;const ext=f.type==='application/pdf'?'pdf':'jpg';const a=document.createElement('a');a.href=URL.createObjectURL(f.blob);a.download=`${p.date}_${(p.type==='purchase'?'INK':'VRK')}_${p.party.replace(/[^\w]+/g,'_')}_${(p.nr||'').replace(/[^\w]+/g,'_')}.${ext}`;a.click();await new Promise(r=>setTimeout(r,300))}}

async function restoreBackup(file){if(!file)return;if(!isOwner()){toast('Alleen-lezen account');return}if(!confirm('Back-up terugzetten? Bestaande facturen met hetzelfde ID worden overschreven, de rest blijft staan.'))return;try{const d=JSON.parse(await file.text());if(!d.state)throw new Error('Ongeldig bestand');const st=d.state;const known=new Set(S.companies.map(c=>c.id));(st.companies||[]).forEach(c=>{if(!known.has(c.id))S.companies.push({id:c.id,name:c.name,short:c.short||c.name,kvk:c.kvk||'',btwnr:c.btwnr||'',iban:c.iban||'',sort:S.companies.length+1})});const merge=(dst,src)=>{const m=new Map(dst.map(x=>[x.id,x]));(src||[]).forEach(x=>m.set(x.id,x));return[...m.values()]};S.purchases=merge(S.purchases,st.purchases);S.sales=merge(S.sales,st.sales);S.bank=merge(S.bank,st.bank);for(const [k,v] of Object.entries(d.files||{})){const bin=atob(v.b64);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);await putFile(k,{blob:new Blob([arr],{type:v.type}),type:v.type,name:v.name})}await syncNow();fillCompanies();render();toast('✅ Back-up teruggezet')}catch(e){toast('❌ '+e.message)}}

 <div style="margin-top:10px"><button class="btn ghost" onclick="logout()">Uitloggen</button></div></div></div>
 <div class="card"><h2>✉ Automatische betalingsherinneringen — ${esc(c.short)}</h2>
 <div class="sub" style="margin-bottom:10px">Stuurt elke week (maandagochtend) automatisch een herinnering naar klanten met een verlopen, onbetaalde verkoopfactuur — alleen als er een e-mailadres bij de factuur staat. De toon wordt strenger bij elke volgende herinnering. Vereist eenmalige installatie van de Edge Function "stuur-herinneringen" (zie instructies eronder).</div>
 ${(()=>{const rc=remCfg(c.id);return `<label class="chk"><input type="checkbox" id="r_enabled" ${rc.enabled?'checked':''} ${isOwner()?'':'disabled'}> Automatische herinneringen aan voor ${esc(c.short)}</label>
 <div class="row" style="margin-top:8px"><div class="field"><label>Eerste herinnering na (dagen te laat)</label><input id="r_days" type="number" min="0" value="${rc.daysAfterDue}" ${isOwner()?'':'disabled'}></div>
 <div class="field"><label>Interval tussen herinneringen (dagen)</label><input id="r_interval" type="number" min="1" value="${rc.intervalDays}" ${isOwner()?'':'disabled'}></div>
 <div class="field"><label>Max. aantal herinneringen</label><input id="r_max" type="number" min="1" max="10" value="${rc.maxReminders}" ${isOwner()?'':'disabled'}></div></div>
 ${isOwner()?`<button class="btn" onclick="saveReminders()">Opslaan</button> <button class="btn sec" onclick="testReminders()">Nu testen (1x direct versturen)</button><div id="remTest"></div>`:''}`})()}
 <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
 <div class="sub"><b>Eenmalige installatie (per Supabase-project, niet per bedrijf):</b> maak een Edge Function <code>stuur-herinneringen</code> aan (net als bij "lees-factuur"), zet de secrets <code>RESEND_API_KEY</code>, <code>RESEND_FROM</code> (bv. <code>"TNS Boekhouding &lt;facturen@jouwdomein.nl&gt;"</code>) en een zelfgekozen <code>CRON_SECRET</code>, en draai daarna het SQL-script dat de wekelijkse planning instelt. Vraag me om de bestanden als je zover bent.</div></div>
 ${S.companies.length>1?`<div class="card"><h2>Overzicht per bedrijf</h2><div class="sub" style="margin-bottom:8px">Sta je een factuur niet te vinden bij het huidige bedrijf? Check hier of hij per ongeluk bij een ander bedrijf is beland (bv. omdat je van bedrijf wisselde tijdens het uploaden).</div>
 <div class="tablewrap"><table><tr><th>Bedrijf</th><th class="num">Inkoop/bonnen</th><th class="num">Verkoop</th><th class="num">Bankmutaties</th><th class="num">Nog te controleren</th></tr>
 ${S.companies.map(cc=>{const p=S.purchases.filter(x=>x.company===cc.id),s=S.sales.filter(x=>x.company===cc.id),bk=S.bank.filter(x=>x.company===cc.id);const chk=p.filter(x=>x.needsCheck).length+s.filter(x=>x.needsCheck).length;return `<tr ${cc.id===S.active?'style="font-weight:600;background:#eef2ff"':''}><td>${cc.id===S.active?'▶ ':''}${esc(cc.short)}</td><td class="num">${p.length}</td><td class="num">${s.length}</td><td class="num">${bk.length}</td><td class="num">${chk?`<span class="neg">${chk}</span>`:'0'}</td></tr>`}).join('')}
 </table></div>
 <div class="sub" style="margin-top:8px">Een factuur verplaatsen naar een ander bedrijf kan in de factuur zelf: open hem en kies het juiste bedrijf boven in het formulier.</div></div>`:''}
 ${isOwner()?`<div class="card"><h2>Gevaarlijke zone</h2><button class="btn danger" onclick="wipeAll()">Alle data van alle bedrijven wissen</button></div>`:``}`}
function saveCompany(){const c=comp();c.name=v('c_name');c.short=v('c_short');c.kvk=v('c_kvk');c.btwnr=v('c_btw');c.iban=v('c_iban');save();fillCompanies();toast('Bedrijfsgegevens opgeslagen');function v(id){return document.getElementById(id).value.trim()}}
function partnersOf(c){return Array.isArray(c.partners)&&c.partners.length?c.partners:[]}
function addPartnerRow(){const c=comp();c.partners=partnersOf(c);const n=c.partners.length;c.partners.push({name:'',pct:n===0?100:0,hours:true,other:0});if(n===1)c.partners[0].pct=50,c.partners[1].pct=50;render()}
function removePartnerRow(i){const c=comp();c.partners.splice(i,1);render()}
function savePartners(){const c=comp();const rows=[...document.querySelectorAll('.partnerRow')];c.partners=rows.map(row=>({name:row.querySelector('.p_name').value.trim(),pct:Math.max(0,Math.min(100,Number(row.querySelector('.p_pct').value)||0)),hours:row.querySelector('.p_hours').checked,other:Number(row.querySelector('.p_other').value)||0}));const tot=c.partners.reduce((a,p)=>a+p.pct,0);save();toast(tot!==100&&c.partners.length?`⚠️ Opgeslagen, maar percentages tellen op tot ${tot}% (moet 100% zijn)`:'✅ Vennoten opgeslagen');render()}
function addCompany(){const n=prompt('Naam van het nieuwe bedrijf:');if(!n)return;const c={id:uid(),name:n,short:n,kvk:'',btwnr:'',iban:'',sort:S.companies.length+1};S.companies.push(c);S.active=c.id;save();fillCompanies();render()}
function removeCompany(){const c=comp();if(!confirm(`"${c.name}" en ALLE bijbehorende facturen en bankmutaties verwijderen?`))return;S.purchases.filter(p=>p.company===c.id).concat(S.sales.filter(p=>p.company===c.id)).forEach(p=>delFile(p.fileId));S.purchases=S.purchases.filter(p=>p.company!==c.id);S.sales=S.sales.filter(p=>p.company!==c.id);S.bank=S.bank.filter(p=>p.company!==c.id);S.companies=S.companies.filter(x=>x.id!==c.id);S.active=S.companies[0].id;save();fillCompanies();render()}
function saveSettings(){S.settings.model=document.getElementById('s_model').value.trim()||'claude-sonnet-4-6';S.settings.autoRead=document.getElementById('s_auto').checked;save();toast('Instellingen opgeslagen')}
function remCfg(companyId){const d={enabled:false,daysAfterDue:7,intervalDays:7,maxReminders:3};return Object.assign(d,(S.settings.reminders||{})[companyId]||{})}
function saveReminders(){S.settings.reminders=S.settings.reminders||{};S.settings.reminders[S.active]={enabled:document.getElementById('r_enabled').checked,daysAfterDue:Number(document.getElementById('r_days').value)||0,intervalDays:Math.max(1,Number(document.getElementById('r_interval').value)||7),maxReminders:Math.max(1,Number(document.getElementById('r_max').value)||3)};save();toast('Herinnering-instellingen opgeslagen')}
async function testReminders(){const el=document.getElementById('remTest');el.innerHTML='<div class="aibox"><div class="spin"></div>Bezig…</div>';try{const {data:{session}}=await sb.auth.getSession();const res=await fetch(SUPABASE_URL+'/functions/v1/stuur-herinneringen',{method:'POST',headers:{'content-type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+session.access_token},body:JSON.stringify({company:S.active,test:true})});const j=await res.json();if(!res.ok)throw new Error(j.error||('Serverfout '+res.status));el.innerHTML=`<div class="ok">✅ ${j.sent||0} herinnering(en) verstuurd${j.skipped?`, ${j.skipped} overgeslagen (geen e-mail, nog niet te laat, of max. bereikt)`:''}.</div>`;save()}catch(e){el.innerHTML='<div class="err">❌ '+esc(e.message)+' — is de function "stuur-herinneringen" gedeployed en zijn de secrets ingesteld?</div>'}}
async function testApi(){const el=document.getElementById('apiTest');el.innerHTML='<div class="aibox"><div class="spin"></div>Testen…</div>';try{const {data:{session}}=await sb.auth.getSession();const res=await fetch(SUPABASE_URL+'/functions/v1/lees-factuur',{method:'POST',headers:{'content-type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+session.access_token},body:JSON.stringify({fileId:'__test__'})});const j=await res.json();if(res.status===404&&/Bijlage niet gevonden/.test(j.error||''))el.innerHTML='<div class="ok">✅ Edge Function bereikbaar, ingelogd en API key aanwezig. Upload een bon om echt te testen.</div>';else if(res.status===500&&/ANTHROPIC_API_KEY/.test(j.error||''))el.innerHTML='<div class="err">❌ ANTHROPIC_API_KEY ontbreekt bij Supabase → Edge Functions → Secrets</div>';else if(res.status===401)el.innerHTML='<div class="err">❌ Sessie niet geaccepteerd: '+esc(j.error||'')+'</div>';else el.innerHTML='<div class="'+(res.ok?'ok':'err')+'">Antwoord '+res.status+': '+esc(j.error||JSON.stringify(j).slice(0,120))+'</div>'}catch(e){el.innerHTML='<div class="err">❌ '+esc(e.message)+' — is de function "lees-factuur" gedeployed?</div>'}}
async function wipeAll(){if(!confirm('Echt ALLES wissen? Dit kan niet ongedaan worden gemaakt.'))return;if(!confirm('Laatste waarschuwing: alle facturen, bank en bijlagen van alle bedrijven worden verwijderd.'))return;const ids=[...S.purchases,...S.sales].filter(p=>p.fileId).map(p=>p.fileId);if(ids.length)await sb.storage.from('bijlagen').remove(ids);S.purchases=[];S.sales=[];S.bank=[];await syncNow();location.reload()}
async function logout(){await sb.auth.signOut();location.reload()}

/* ================== START / LOGIN ================== */
async function login(){const em=document.getElementById('lockem').value.trim(),pw=document.getElementById('lockpw').value;const err=document.getElementById('lockerr');err.textContent='Inloggen…';const {error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error){err.textContent='Inloggen mislukt: '+(error.message==='Invalid login credentials'?'onjuist e-mailadres of wachtwoord':error.message);return}err.textContent='';await boot()}
async function boot(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session){document.getElementById('lock').style.display='flex';setTimeout(()=>document.getElementById('lockem').focus(),100);return}
 S.user=session.user;document.getElementById('lock').style.display='none';
 try{await load()}catch(e){toast('❌ Laden mislukt: '+esc(e.message),8000);return}
 fillCompanies();route();setSyncState('ok');
 if(!isOwner())document.querySelectorAll('.drop').forEach(d=>d.style.display='none');
}
sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT'){document.getElementById('lock').style.display='flex'}});
boot();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})})}
let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredInstallPrompt=e;const b=document.getElementById('installBtn');if(b)b.style.display='inline-flex'});
async function installApp(){if(!deferredInstallPrompt)return;deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;const b=document.getElementById('installBtn');if(b)b.style.display='none'}
window.addEventListener('appinstalled',()=>{const b=document.getElementById('installBtn');if(b)b.style.display='none'});
document.addEventListener('paste',e=>{const items=[...(e.clipboardData?.items||[])].filter(i=>i.type.startsWith('image/')).map(i=>i.getAsFile());if(items.length&&!document.getElementById('invModal').classList.contains('open'))handleFiles(items)});
</script>
</body>
